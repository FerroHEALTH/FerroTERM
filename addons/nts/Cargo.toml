[package]
name = "addon-nts"
description = "The Nationale Terminologie Server source add-on for the FerroTERM sync service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# An add-on is compiled into the sync service and never uploaded, and the bare
# name `nts` belongs to another project on crates.io.
publish = false

[dependencies]
# The redacting type the account's secrets are held in.
ferrohealth-secret.workspace = true
# The OAuth 2.0 client credentials grant and its token cache.
ferrohealth-smart.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
terminology-syndication.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
tracing.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "rt-multi-thread", "macros"] }
wiremock.workspace = true

[lints]
workspace = true
