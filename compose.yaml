# FerroTERM quickstart, a standalone file: download it next to a built index
# and run
#
#   docker compose up
#   curl 'http://localhost:8080/r4b/metadata?mode=terminology'
#
# It pulls the published image (ghcr.io/ferrohealth/ferroterm, pinned to the
# release this file shipped with) and needs no repository checkout. The one
# thing you provide is the index root: a directory whose child directories
# are the artifacts ferroterm-build wrote (each with store.redb, hierarchy.bin,
# text.bin, manifest.json), mounted read-only at /data/index. A root is the
# layout the sync service writes, one child per release, so start with one.
# Point FERROTERM_INDEX_DIR at it, or place it at ./index beside this file.
#
#   FERROTERM_INDEX_DIR=/srv/ferroterm/index docker compose up
#
# The image tag below is bumped at every release cut; scripts/checks/versions.sh
# keeps it equal to the workspace version.
#
# Ports bind the loopback interface by default: a published port is DNAT'd
# ahead of the host firewall's own chains, so a port on 0.0.0.0 is reachable
# even when the firewall says otherwise
# (https://docs.docker.com/engine/network/packet-filtering-firewalls/). To
# serve another machine, name the interface, or put a reverse proxy in front:
#
#   FERROTERM_BIND_HOST=0.0.0.0 docker compose up
#   FERROTERM_PORT=8081 docker compose up
#
# Hardening: the container drops every capability, refuses privilege
# escalation, and runs a read-only root filesystem; the server writes only its
# own state (the usage report's instance id) to the `ferroterm-state` volume.
# The image runs as uid 65532 and has no shell; the health probe is the binary
# itself (`ferroterm healthcheck`), declared on the service below.

services:
  ferroterm:
    image: ghcr.io/ferrohealth/ferroterm:${FERROTERM_VERSION:-0.3.0}
    container_name: ferroterm
    restart: unless-stopped
    ports:
      - "${FERROTERM_BIND_HOST:-127.0.0.1}:${FERROTERM_PORT:-8080}:8080"
    environment:
      FERROTERM__TERMINOLOGY__INDEX: /data/index
      # FHIR CodeSystem resources (a package's `package/` directory or JSON
      # files) are served from a second mount: add `FERROTERM__TERMINOLOGY__CODE_SYSTEMS:
      # /data/codesystems` here and a read-only bind volume below.
      # `pretty` for a person watching `docker compose up`; a log pipeline
      # sets `json` (one object per line). `RUST_LOG` filters.
      FERROTERM__TELEMETRY__FORMAT: ${FERROTERM__TELEMETRY__FORMAT:-pretty}
      FERROTERM__TERMINOLOGY__DEFAULT_LANGUAGE: ${FERROTERM__TERMINOLOGY__DEFAULT_LANGUAGE:-en}
      # The URL clients reach this server at, when a proxy sits in front: it
      # becomes `CapabilityStatement.implementation.url`, per version, and it
      # is what the SMART gate accepts as a token audience.
      FERROTERM__FHIR__BASE_URL:
      # The authentication the proxy enforces, declared in the capability
      # statement (`OAuth`, `SMART-on-FHIR`, `Basic`, `Certificates`, ...).
      FERROTERM__FHIR__SECURITY_SERVICES:
      RUST_LOG: ${RUST_LOG:-info}
      # The usage report to FerroPULSE: on by default, `FERROTERM__USAGE_REPORT__ENABLED=false`
      # stops it. What it sends and when:
      # https://ferroterm.eu/docs/operate/usage-report.html
      FERROTERM__USAGE_REPORT__ENABLED: ${FERROTERM__USAGE_REPORT__ENABLED:-true}
      FERROTERM__USAGE_REPORT__DEPLOYMENT: compose
      # The instance id lives here, on the one writable volume.
      FERROTERM__USAGE_REPORT__STATE_DIR: /data/state
    volumes:
      - type: bind
        source: ${FERROTERM_INDEX_DIR:-./index}
        target: /data/index
        read_only: true
      - type: volume
        source: ferroterm-state
        target: /data/state
    # The image declares the same probe (`ferroterm healthcheck`: one GET
    # /health/readiness, exit 0 on 200). Stating it here is what lets another service
    # wait on it with `condition: service_healthy`, as the proxy below does,
    # and what `docker compose up --wait` waits for. A large edition on a slow
    # disk raises start_period.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroterm", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The offline index build, one shot, under its own profile so `docker compose
  # up` never starts it. Same image. The directory holding your release files
  # (licensed downloads you obtained yourself) is mounted read-only at
  # /releases, the index lands in the directory the server reads, one child
  # per code system. The arguments after `build` are ferroterm-build's own, so
  # every code system it knows builds through this one service. Run it once
  # per release:
  #
  #   docker compose run --rm build --rf2 /releases/SnomedCT_Release.zip
  #   docker compose run --rm build --loinc /releases/Loinc_2.83.zip
  #
  # Each writes a child of /data/index named for the source (snomed, loinc,
  # ...), which is ${FERROTERM_INDEX_DIR:-./index}/snomed on the host, and
  # prints the path. FERROTERM_INDEX_ROOT tells ferroterm-build that root:
  # an `--out` outside it is refused, because the container's own filesystem
  # is gone with `--rm`, and the service runs in /data/index, so a relative
  # `--out loinc-2.83` lands on the mount too.
  #
  # FERROTERM_RELEASES_DIR names the directory, ./releases beside this file by
  # default. With no arguments the service prints ferroterm-build's help. A
  # zip is unpacked to the container's /tmp (a tmpfs here) and gone with the
  # container; no release content is written anywhere else.
  build:
    image: ghcr.io/ferrohealth/ferroterm:${FERROTERM_VERSION:-0.3.0}
    profiles: [build]
    entrypoint: ["/usr/local/bin/ferroterm-build"]
    command: ["--help"]
    working_dir: /data/index
    environment:
      TMPDIR: /tmp
      FERROTERM_INDEX_ROOT: /data/index
    volumes:
      - type: bind
        source: ${FERROTERM_RELEASES_DIR:-./releases}
        target: /releases
        read_only: true
      - type: bind
        source: ${FERROTERM_INDEX_DIR:-./index}
        target: /data/index
    tmpfs:
      - /tmp:size=4g
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # A TLS terminating reverse proxy in front of the server, under its own
  # profile so `docker compose up` stays the plain quickstart:
  #
  #   FERROTERM_DOMAIN=tx.example.org docker compose --profile proxied up
  #   curl 'https://tx.example.org/r4b/metadata?mode=terminology'
  #
  # Caddy fetches and renews the certificate itself and forwards to the server
  # over the compose network; the server binds no public port in this profile
  # (it is reachable as `ferroterm:8080` inside the network alone). With the
  # default domain, `localhost`, Caddy issues from its own internal CA, so the
  # quickstart works offline; name a real domain and it uses Let's Encrypt.
  #
  # FERROTERM__FHIR__BASE_URL is what makes `CapabilityStatement.implementation.url`
  # correct: the server answers on an address it never sees, so it states the
  # one clients use. Set it to the same scheme and host as the proxy. With a
  # SMART issuer configured it is also the token audience the write routes
  # accept, one FHIR base per served version.
  #
  # The proxy is the place for authentication and rate limiting: the server has
  # neither, and `FERROTERM__FHIR__SECURITY_SERVICES` only declares what you put in
  # front (`OAuth`, `SMART-on-FHIR`, ...). See the book,
  # https://ferroterm.eu/book/operate/reverse-proxy.html.
  proxy:
    image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: [proxied]
    restart: unless-stopped
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${FERROTERM_DOMAIN:-localhost}
      - --to
      - ferroterm:8080
    ports:
      - "${FERROTERM_HTTP_PORT:-80}:80"
      - "${FERROTERM_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # Started once the server answers GET /health, so the first proxied request
    # never meets a server still reading its index.
    depends_on:
      ferroterm:
        condition: service_healthy
    cap_drop:
      - ALL
    # Binding 80 and 443 inside the container needs the one capability the
    # image asks for; everything else stays dropped.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # The FerroTERM Console, its own image, beside the server:
  #
  #   docker compose --profile console up
  #
  # then open http://localhost:3000. It reaches the server over the compose
  # network, server to server, and serves no FHIR request itself. Reading is
  # open, as the server's read surface is; set the FERROTERM_CONSOLE__OIDC__*
  # variables in your shell or .env to offer a sign-in for editing, with the
  # client secret in ./secrets/console_oidc_client_secret.
  console:
    image: ghcr.io/ferrohealth/ferroterm-console:${FERROTERM_VERSION:-0.3.0}
    profiles: [console]
    restart: unless-stopped
    depends_on:
      ferroterm:
        condition: service_healthy
    ports:
      - "${FERROTERM_BIND_HOST:-127.0.0.1}:${FERROTERM_CONSOLE_PORT:-3000}:3000"
    environment:
      # The image sets the same value; repeated so `docker compose config`
      # shows the address the container binds.
      FERROTERM_CONSOLE__SERVER__LISTEN: 0.0.0.0:3000
      # The server, over the compose network.
      FERROTERM_CONSOLE__FERROTERM__BASE_URL: http://ferroterm:8080/
      # The address readers reach the server at, which the console shows
      # beside every request it makes; the base URL when unset.
      FERROTERM_CONSOLE__FERROTERM__PUBLIC_URL:
      # Passed through only when set in your shell or .env: without an issuer
      # the console offers no sign-in, while an empty one is a boot error.
      FERROTERM_CONSOLE__OIDC__ISSUER:
      FERROTERM_CONSOLE__OIDC__AUTHORIZATION_ENDPOINT:
      FERROTERM_CONSOLE__OIDC__TOKEN_ENDPOINT:
      FERROTERM_CONSOLE__OIDC__JWKS_URI:
      FERROTERM_CONSOLE__OIDC__CLIENT_ID:
      FERROTERM_CONSOLE__OIDC__CLIENT_SECRET_FILE:
      FERROTERM_CONSOLE__OIDC__REDIRECT_URI:
      FERROTERM_CONSOLE__OIDC__SCOPES:
      FERROTERM_CONSOLE__OIDC__OFFLINE_ACCESS:
      FERROTERM_CONSOLE__OIDC__END_SESSION_ENDPOINT:
      FERROTERM_CONSOLE__OIDC__REVOCATION_ENDPOINT:
      FERROTERM_CONSOLE__OIDC__POST_LOGOUT_REDIRECT_URI:
      FERROTERM_CONSOLE__SESSION__SECURE_COOKIE:
    secrets:
      - console_oidc_client_secret
    # The console keeps its sessions in memory and writes no file, so the
    # root filesystem is read-only and no volume is mounted.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  # The console's OIDC client secret at your OpenID Provider, read once at
  # boot through FERROTERM_CONSOLE__OIDC__CLIENT_SECRET_FILE.
  console_oidc_client_secret:
    file: ${FERROTERM_CONSOLE_OIDC_CLIENT_SECRET_FILE:-./secrets/console_oidc_client_secret}

volumes:
  ferroterm-state:
  caddy-data:
  caddy-config:
