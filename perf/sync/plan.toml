# The plan of the performance gate for ferroterm-sync (ferrohealth-perf,
# FerroHEALTH/FerroSYS#249), run by scripts/perf/gate.sh in the tool's A/B
# mode against the base and the head of a change. The service runs
# with a daily schedule whose next run is twelve hours away, so the idle
# phase measures it waiting between two scheduled runs; the load phase reads
# its admin listener. The service holds no database, so the idle phase
# judges its CPU alone. No specification governs this: our own design.

[idle]
duration_secs = 60
max_cpu_percent = 2.0

[load]
rate = 50.0
warmup_secs = 10
duration_secs = 60

# How far the head may stray from the base, beyond the noise the two arms
# show: the family's tolerances (FerroHEALTH/FerroSYS#249). Neither service
# holds a database, so no transaction is judged.
[tolerance]
latency = 0.25
throughput = 0.2
memory = 0.2
cpu = 0.25

[[requests]]
group = "runs"
method = "GET"
path = "/runs"
status = 200

[[requests]]
group = "readiness"
method = "GET"
path = "/health/readiness"
status = 200
