# release.yml — THE release pipeline.
#
# ONE workflow owns the `v*` tag, and every ordering in it is a `needs` edge.
# The graph:
#
#   plan ── github-release (draft) ─┬─ build-binaries ── build-image ─┬─ vulnerability-record ── scan-and-tag ── finalize-release (publish) ── crates ── milestone
#                                   └─ build-console ─────────────────┘
#
# Both images are pushed by digest with no tag. `vulnerability-record` scans
# them and the server's glibc tarballs with every severity, fixed or not, and
# scripts/checks/vex-coverage.sh refuses the release while a finding has no
# judging statement under security/vex/ (CRA Annex I Part I(2)(a)).
# `scan-and-tag` then gates on fixable HIGH and CRITICAL findings and only
# then tags the digests, and the release publishes only after both, so a
# refused release has neither image tags nor a published page.
#
# `plan` runs scripts/release/plan.sh: it refuses a tag whose milestone (titled
# exactly as the tag) is missing or still holds an open item, whose changelog
# section breaks the structure or the Security rules, or whose notes lack the
# support period or the CRA user-information link. `milestone` closes the
# milestone once every leg succeeded (scripts/release/milestone.sh).
#
# The release is created as a DRAFT, the per-arch binaries + SBOMs + Sigstore
# bundles are attached by the reusable build lane, and only then — once every
# expected asset is present — is the release PUBLISHED, which freezes it
# (GitHub release immutability is the intended end state). The recovery path for
# a bad cut is a new patch version, never a retag.
#
# This workflow is dormant until a tag is pushed, so it stays green in the
# pre-code discovery phase by never running. `workflow_dispatch` re-runs it for
# an existing tag and MUST be dispatched AT that tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish — dispatch this workflow AT that tag"
        required: true
        type: string

# A release must never be cancelled part-way through publishing: a half-created
# release with some assets attached is worse than a queued second run. A second
# tag push QUEUES behind the first rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ── plan: every release fact, verified before anything is built ─────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read # the milestone titled as the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      # The console ships as an image on distroless static, so its binary is
      # built for the two static targets alone, each named by the platform
      # it fills.
      console-targets: '{"include":[{"runner":"ubuntu-latest","target":"x86_64-unknown-linux-musl","arch":"amd64"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","arch":"arm64"}]}'
      is-prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - id: tag
        name: Resolve and validate the release tag
        # The dispatch input reaches the shell via env, never `${{ }}`-inline,
        # and must match a full semver tag shape before it is used as a checkout
        # ref below.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
              echo "::error::dispatched at '${GITHUB_REF}', not at refs/tags/${tag}. Run: gh workflow run Release --ref ${tag} -f tag=${tag}" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          # A tag carrying a pre-release suffix (v1.2.3-rc1) publishes as a
          # pre-release; a bare vX.Y.Z is an official release.
          case "$tag" in
            *-*) is_prerelease=true ;;
            *)   is_prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

      # github.sha is the commit the event ref pointed at; the tag-mismatch
      # refusal above guarantees it IS the tag's commit on a dispatch too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Every release fact, verified at the tagged commit before anything is
      # built: the milestone, the version, the changelog structure and its
      # Security rules (CRA Annex I Part II(2), (4) and (8)), and the notes
      # with the support period and the CRA user-information link (Art 13(18)
      # and (19)). One list, scripts/release/plan.sh, which
      # scripts/release/preflight.sh runs before the tag (no specification
      # governs the list: our own design).
      - name: Every release fact holds at the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release/plan.sh checks "$TAG" --notes release-notes.md

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # ── github-release: create the release as a DRAFT ───────────────────────────
  github-release:
    name: github release (draft)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # Created as a DRAFT and finalized only after every asset is attached: the
      # binaries and their Sigstore bundles are produced by build-binaries,
      # which runs after this job, and publishing here would freeze the release
      # before those assets exist. A draft is still mutable — the window those
      # uploads need.
      - name: Create the GitHub release as a draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ needs.plan.outputs.tag }}
          # The title is the bare version; the repository already says whose
          # release it is.
          name: ${{ needs.plan.outputs.version }}
          body_path: release-notes.md
          # The quickstart compose file rides along as a release asset: it pulls
          # the image this tag publishes, so a downloader never clones the repo.
          files: compose.yaml
          prerelease: ${{ needs.plan.outputs.is-prerelease }}

  # ── build-binaries: the SLSA L3 lane, once per target ───────────────────────
  # This job is a CALL AND NOTHING ELSE, deliberately: SLSA Build L3 requires
  # the signing material to be out of reach of user-defined build steps, and a
  # job's steps all share one runner VM. A reusable-workflow call cannot carry
  # `steps:`, which makes that regression unrepresentable rather than merely
  # discouraged. Native Linux runner per arch (the server ships for Linux
  # containers and hosts only): no cross toolchain, no QEMU.
  build-binaries:
    name: binaries (${{ matrix.target }})
    needs: [plan, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    # Declared on both sides: a reusable workflow receives the caller's token
    # permissions, and GitHub's L3 guide asks for the same set in both places.
    permissions:
      contents: write # attach the per-arch tarballs to the release
      id-token: write # Sigstore, for the provenance + SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ github.sha }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  # ── build-image: the container image from the attested musl binaries ────────
  # A call and nothing else, for the same L3 reason as build-binaries.
  build-image:
    name: image (linux/amd64, linux/arm64)
    needs: [plan, build-binaries]
    permissions:
      contents: read
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ github.sha }}

  # ── build-console: the console's binaries, site bundle and image ─────────────
  # A call and nothing else, for the same L3 reason. It attaches the console's
  # assets to the draft, so it waits for the draft to exist.
  build-console:
    name: console (binaries, site bundle, image)
    needs: [plan, github-release]
    permissions:
      contents: write # attach the console's assets to the draft release
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-console.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
      targets: ${{ needs.plan.outputs.console-targets }}

  # ── vulnerability-record: every finding, judged, or no release ──────────────
  # CRA Annex I Part I(2)(a) (Regulation (EU) 2024/2847): no known exploitable
  # vulnerability. The gate in scan-and-tag blocks HIGH and CRITICAL findings
  # that have a fix; this job scans the same pushed digests and the server's
  # glibc tarballs (the musl ones are what the server image carries) with no
  # severity floor and no `ignore-unfixed`, and scripts/checks/vex-coverage.sh
  # refuses the release while any finding lacks an OpenVEX statement under
  # security/vex/. The record and the raw reports are release assets.
  vulnerability-record:
    name: vulnerability record
    needs: [plan, github-release, build-binaries, build-image, build-console]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # read the draft's tarballs, attach the record to it
      packages: read # pull the digests the image jobs pushed
    env:
      TRIVY_VERSION: "0.73.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: The coverage check refuses what it claims to refuse
        run: bash scripts/checks/vex-coverage.sh --self-test
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan every image and tarball, every severity, fixed or not
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SERVER_DIGEST: ${{ needs.build-image.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.build-console.outputs.digest }}
        run: |
          set -euo pipefail
          # An explicit empty config and ignore file: trivy reads ./trivy.yaml
          # and its ignore file by default, which would put the gate's floor
          # and its exceptions back into the record.
          : > "$RUNNER_TEMP/empty.yaml"
          : > "$RUNNER_TEMP/empty.ignore"
          scan=(--config "$RUNNER_TEMP/empty.yaml" --ignorefile "$RUNNER_TEMP/empty.ignore"
            --scanners vuln --severity "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
            --ignore-unfixed=false --format json --quiet)
          mkdir -p reports
          targets=()
          for entry in "ferroterm|$SERVER_DIGEST" "ferroterm-console|$CONSOLE_DIGEST"; do
            image="${entry%%|*}"
            digest="${entry#*|}"
            [ -n "$digest" ] || { echo "::error::no pushed digest for ${image}"; exit 1; }
            for platform in linux/amd64 linux/arm64; do
              report="reports/${image}-${platform##*/}.json"
              trivy image "${scan[@]}" --platform "$platform" --output "$report" \
                "ghcr.io/ferrohealth/${image}@${digest}"
              targets+=("pkg:oci/${image}=${report}")
            done
          done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "ferroterm-${TAG}-*-unknown-linux-gnu.tar.gz" --dir tarballs
          for arch in x86_64 aarch64; do
            root="tarballs/${arch}"
            mkdir -p "$root"
            tar -C "$root" -xzf "tarballs/ferroterm-${TAG}-${arch}-unknown-linux-gnu.tar.gz"
            report="reports/ferroterm-${arch}-unknown-linux-gnu.json"
            trivy rootfs "${scan[@]}" --output "$report" "$root"
            targets+=("pkg:cargo/ferroterm-server=${report}")
          done
          printf '%s\n' "${targets[@]}" > targets.txt
      - name: Every finding carries an exploitability judgement
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t targets < targets.txt
          bash scripts/checks/vex-coverage.sh \
            --record "ferroterm-${TAG}-vulnerability-record.json" "${targets[@]}"
          tar -czf "ferroterm-${TAG}-trivy-reports.tar.gz" reports
      # Kept for a refused run too, so the findings to judge are one download
      # away rather than one re-run away.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulnerability-record
          path: |
            reports/
            ferroterm-*-vulnerability-record.json
          if-no-files-found: warn
          retention-days: 30
      - name: Attach the record to the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ needs.plan.outputs.tag }}
          files: |
            ferroterm-${{ needs.plan.outputs.tag }}-vulnerability-record.json
            ferroterm-${{ needs.plan.outputs.tag }}-trivy-reports.tar.gz

  # ── scan-and-tag: the gate that makes the pushed digests referencable ───────
  # A call and nothing else. It runs after the record, so a release the record
  # refuses gets no image tags.
  scan-and-tag:
    name: scan + tag
    needs: [build-image, build-console, vulnerability-record]
    permissions:
      contents: read
      packages: write # pull the pushed digests, then tag them
    uses: ./.github/workflows/scan-and-tag.yml
    with:
      server-image: ghcr.io/ferrohealth/ferroterm
      server-digest: ${{ needs.build-image.outputs.digest }}
      server-tags: ${{ needs.build-image.outputs.tags }}
      console-image: ghcr.io/ferrohealth/ferroterm-console
      console-digest: ${{ needs.build-console.outputs.digest }}
      console-tags: ${{ needs.build-console.outputs.tags }}

  # ── finalize-release: verify the asset set, then PUBLISH (freeze) ───────────
  finalize-release:
    name: github release (publish)
    # The record and the tags first: the published page and its compose.yaml
    # point at the image tags, which exist only once both passed.
    needs: [plan, build-binaries, build-image, build-console, vulnerability-record, scan-and-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Every expected asset is attached before the release is frozen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=""
          # Every suffix release-build.yml uploads per target. `grep -Fxq` —
          # fixed string, whole line — so ".tar.gz" is not satisfied by
          # ".tar.gz.sigstore.json".
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            aarch64-unknown-linux-musl; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.build-sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".cdx.json"; do
              printf '%s\n' "$assets" \
                | grep -Fxq "ferroterm-${TAG}-${target}${suffix}" \
                || missing="$missing ferroterm-${TAG}-${target}${suffix}"
            done
            printf '%s\n' "$assets" \
              | grep -Fxq "ferroterm-build-${TAG}-${target}.cdx.json" \
              || missing="$missing ferroterm-build-${TAG}-${target}.cdx.json"
          done
          # Every suffix release-console.yml uploads: per console target, and
          # once for the architecture-independent site bundle.
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".spdx.json"; do
              printf '%s\n' "$assets" | grep -Fxq "ferroterm-console-${TAG}-${target}${suffix}" \
                || missing="$missing ferroterm-console-${TAG}-${target}${suffix}"
            done
          done
          for suffix in ".tar.gz" ".tar.gz.sha256sum" ".tar.gz.sigstore.json" ".tar.gz.intoto.jsonl"; do
            printf '%s\n' "$assets" | grep -Fxq "ferroterm-console-${TAG}-site${suffix}" \
              || missing="$missing ferroterm-console-${TAG}-site${suffix}"
          done
          printf '%s\n' "$assets" | grep -Fxq "compose.yaml" || missing="$missing compose.yaml"
          for name in "ferroterm-${TAG}-vulnerability-record.json" "ferroterm-${TAG}-trivy-reports.tar.gz"; do
            printf '%s\n' "$assets" | grep -Fxq "$name" || missing="$missing $name"
          done
          [ -z "$missing" ] || {
            echo "::error::the draft is missing assets, so it will not be published:$missing"
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # ── crates: the crates.io publish, approval-gated, after the release exists ─
  # Runs in the `crates-io` environment (a required reviewer pauses it) with
  # Trusted Publishing (OIDC); the per-crate, resumable script is shared with
  # publish-crates.yml. Idempotent: a release whose crate line was published
  # already uploads nothing and stays green.
  crates:
    name: crates.io
    needs: [plan, finalize-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in the lane that uploads to crates.io: a published version is
      # immutable, so it is built from this checkout and nothing else.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh publish
      - name: Verify every crate resolves at the crate-line version
        if: always()
        run: bash scripts/release/publish-crates.sh verify

  # ── milestone: close the release's milestone ────────────────────────────────
  # Runs after every leg, the approval-gated crates leg included. `always()`
  # keeps the job in the graph when a leg fails, so its log names that leg and
  # the milestone stays open; a re-run of the failed jobs closes it. An
  # already-closed milestone counts as done.
  milestone:
    name: close the milestone
    needs: [plan, github-release, build-binaries, build-image, build-console, vulnerability-record, scan-and-tag, finalize-release, crates]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the script
      issues: write # close the milestone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Close the milestone titled as the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/release/milestone.sh close "$TAG"
