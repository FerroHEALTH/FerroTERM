# SonarQube Cloud analysis — the machine opinion beside CodeQL. Findings are
# ADVISORY: they never outrank the specs, the project rules, or the local
# gates, and they gate no merge (.claude/rules/ai-code-review.md).
#
# Rust is analyzed first-party (the analyzer runs Clippy from the root
# Cargo.toml); shell, YAML, Dockerfiles and other languages are covered by the
# multi-language sweep, which runs NOW — before any Rust exists. The Rust-only
# steps (the pinned toolchain, the instrumented coverage run, the
# projectVersion derivation) are guarded on Cargo.toml, so the sweep still
# analyzes config and shell in discovery. Scan SCOPE lives in
# sonar-project.properties (do not overwrite it here).
#
# It runs on a push to main and weekly, never on a pull request or a merge
# group: it gates no merge, and the org shares 20 concurrent jobs that the
# gates need (owner decision, 2026-11-25).
name: SonarQube Cloud

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC

# A newer push to main replaces a running analysis, so main is analyzed at
# its latest commit.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write # the main-branch SARIF upload to code scanning
      actions: read # upload-sarif reads the run it belongs to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar assigns issues and new-code status by blame.
          fetch-depth: 0
          persist-credentials: false

      # ── Rust-only steps, guarded on the workspace existing ──────────────────
      # hashFiles() works here because the checkout above populated the
      # workspace. In discovery these skip and the sweep still analyzes
      # shell/yaml below.
      - name: Install the Rust toolchain
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: llvm-tools-preview
          cache-shared-key: sonar
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov + cargo-nextest
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Instrumented tests → lcov
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo llvm-cov nextest --locked --workspace --all-features --no-tests=pass --no-fail-fast --lcov --output-path lcov.info

      # The console's screens are proven by the browser journeys, which the
      # nextest run above never drives, so the journeys run here against an
      # instrumented console and their coverage is a second report.
      - name: Install Chrome and chromedriver
        if: ${{ hashFiles('Cargo.toml') != '' }}
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 158.0.8127.88
          install-chromedriver: true
      - name: The journeys against an instrumented console → lcov
        if: ${{ hashFiles('Cargo.toml') != '' }}
        env:
          FERROTERM_UI_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROTERM_UI_E2E_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: bash scripts/ui-e2e-coverage.sh console-journeys.lcov

      # sonar.projectVersion anchors the "Previous version" New Code window: the
      # workspace version bumps at every release cut, so "new code" means "since
      # the last release". Read from the root Cargo.toml at scan time (never a
      # second hand-maintained copy) and appended to the properties file — so no
      # context value reaches a shell or the action args.
      - name: Derive sonar.projectVersion from the workspace version
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "sonar.projectVersion=$v" >> sonar-project.properties

      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # SonarQube Cloud reports to GitHub code scanning itself only on Sonar's
      # Enterprise plan, so the main branch's open issues are converted to
      # SARIF here and uploaded the way scorecard.yml uploads its own; the
      # alerts stay advisory.
      - name: Convert the main branch's open issues to SARIF
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: scripts/sonar/sarif.sh sonar.sarif

      - name: Upload the SARIF log to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sonar.sarif
          category: sonarqube-cloud
