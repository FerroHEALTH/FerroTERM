# CI — two tiers.
#
#   1. The workflows/shell tier runs NOW, on an empty (pre-code) repository:
#      actionlint + zizmor over .github/workflows, and shellcheck over the
#      tracked shell scripts. These are the checks that keep this very file
#      honest, so they must never depend on Rust existing.
#   2. The Rust tier is GUARDED behind a detection job that checks for a
#      Cargo.toml. Every cargo lane is skipped cleanly until the workspace
#      lands, then activates by itself — no workflow edit needed. (hashFiles()
#      cannot gate a job at `if:` time because the workspace is empty before
#      checkout, so a real detection job is the correct primitive.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited`, `labeled` and `unlabeled` started a second run on
    # the same commit, the concurrency group cancelled the first, and its
    # `conclusion` reported a failure on the head commit (#848). The guards
    # read their labels from the API when they run, and
    # pr-guards.yml re-runs the one a change affects once this run completes.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  # A pull request's runs share one group per ref, and a new commit cancels
  # the run it replaces. Every other run gets a group of its own, because a
  # group holds one pending run and a newer one cancels it whatever
  # cancel-in-progress says, which dropped pushes to main (#1191).
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

# A server a lane starts is no installation, so it sends no usage report
# (scripts/checks/usage-report-off.sh holds every launcher to this).
env:
  FERROTERM__USAGE_REPORT__ENABLED: "false"

jobs:
  # ── Tier 1: the workflow + shell checks (always run) ────────────────────────

  # The workflow and container linters in one job: each linter is a step
  # that runs whatever the step before it concluded, so one run reports
  # every finding, and the job takes one runner where it took four (#1189).
  # No specification governs this: our own design.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- zizmor ------------------------------------------------------

      # zizmor (docs.zizmor.sh) — static security analysis for GitHub Actions, the
      # machine check behind three hard properties here: every `uses:` hash-pinned
      # (unpinned-uses), no checkout persisting credentials without a recorded
      # exception (artipacked), and no context value spliced into a shell
      # (template-injection).
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: zizmor@1.30.1
      - name: zizmor / Audit .github/workflows
        if: ${{ !cancelled() }}
        # GH_TOKEN enables the ONLINE audits: impostor-commit verifies that a
        # pinned commit really belongs to the repository named in front of it,
        # which it cannot do offline. --min-severity=low gates every actionable
        # tier and leaves the informational tier advisory.
        #
        # The online audit reaches GitHub once per pinned action, and a
        # transient 5xx there surfaces as exit code 1, the tool-failure code
        # (docs.zizmor.sh/usage). Only that code is retried: a clean run (0)
        # and a finding (11 to 14) return on the first attempt, so the retry
        # can never hide an audit result.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            status=0
            zizmor --config .github/zizmor.yml --min-severity=low .github/workflows/ || status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::zizmor failed with a tool error (attempt ${attempt}/3); retrying"
              sleep $((attempt * 15))
            fi
          done
          exit 1

      # ---- actionlint --------------------------------------------------
      # actionlint — the CORRECTNESS half of the pair: `${{ }}` expressions that
      # cannot evaluate, `needs:` naming a job that does not exist, unknown runner
      # labels, and shellcheck over every embedded `run:` block.
      - name: actionlint / Lint .github/workflows
        if: ${{ !cancelled() }}
        # The OFFICIAL image, digest-pinned. actionlint is a Go binary (not a
        # crate), and its own README's alternative is `curl | bash` off main —
        # exactly the unpinned fetch this repository's pinning rule forbids.
        # The image also BUNDLES shellcheck, which half of actionlint's value
        # depends on.
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence here is a `printf` format or a `jq` filter,
        # where single quotes are the correct idiom.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # ---- shellcheck --------------------------------------------------
      # shellcheck over the tracked shell scripts — every CI guard, vendor fetcher,
      # and hook. `--severity=style` is the lowest floor, so everything gates: a
      # finding is fixed, or carries a per-line `# shellcheck disable=SCnnnn`
      # directive with its reason. No .shellcheckrc, deliberately — nothing may turn
      # a code off tree-wide.
      - name: shellcheck
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck / Every tracked shell program is clean at severity=style
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Every tracked *.sh, plus every tracked extensionless file whose
          # first line is a shell shebang (covers git hooks). A NUL-delimited
          # pipe so paths with spaces survive.
          {
            git ls-files -z '*.sh'
            git ls-files -z | while IFS= read -r -d '' f; do
              case "$f" in
                *.*) ;;
                *) head -c2 "$f" 2>/dev/null | grep -q '#!' \
                     && head -n1 "$f" | grep -qE 'sh$' && printf '%s\0' "$f" ;;
              esac
            done
          } | { grep -zc . >/dev/null && xargs -0 -r shellcheck --severity=style; } \
            || echo "no shell files to check"
      - name: shellcheck / The performance gate reads its schedule, holds the sync plans' idle tables equal and resolves its base
        if: ${{ !cancelled() }}
        run: bash scripts/perf/gate.sh --self-test

      # ---- hadolint ----------------------------------------------------
      - name: hadolint
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: .hadolint.yaml
      # A recipe with a suffix is named on its own: the recursive pattern above
      # matches the name exactly, and a wildcard would also catch a
      # `.dockerignore` beside one, which is not a Dockerfile.
      - name: hadolint
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile.sync
          config: .hadolint.yaml

  # The committed guards in one job: each guard is a step that runs
  # whatever the step before it concluded, so one run reports every
  # finding, and the job takes one runner where it took fourteen (#1189).
  # No specification governs this: our own design.
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- comment-style -----------------------------------------------
      # comment-style: the RFC 505 / RFC 1574 comment budgets over every
      # hand-written .rs file. The per-edit hook runs the same script on the files
      # it just touched, which says nothing about a file an editor changed outside
      # the hook, so the whole tree is swept here. It reads the checkout and needs
      # no toolchain, which is why it sits in tier 1.
      - name: comment-style
        if: ${{ !cancelled() }}
        run: bash scripts/checks/comment-style.sh --all

      # ---- stray-literals ----------------------------------------------
      # stray-literals: a string the console draws belongs in its catalog under
      # app/ferroterm-console/locales/, and a file holds no more stray literals
      # than its baseline while the strings move (#749). A fall passes with a
      # note, and ratchet-tighten.yml lowers the baseline on main (#954). It
      # reads the checkout and needs no toolchain, so it sits in tier 1.
      - name: stray-literals
        if: ${{ !cancelled() }}
        run: bash scripts/checks/stray-literals.sh app/ferroterm-console/src

      # ---- duplication -------------------------------------------------
      # The duplicated lines of the hand-written Rust may fall and never rise
      # (#950, .claude/rules/rust-style.md, Code is written once). jscpd runs from
      # its official image, pinned by digest in docs/VERSIONS.md, and the count
      # and the key of every counted block are committed beside the guard. A rise
      # fails and names the new blocks by both places; a fall passes, and
      # ratchet-tighten.yml lowers the count on main.
      - name: duplication / Duplication ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh --self-test
      - name: duplication / The duplicated lines have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh

      # ---- file-size ---------------------------------------------------
      # A hand-written source file carries at most 800 lines, its inline tests
      # included (#950). A file over it on the day the guard landed stands in
      # scripts/checks/file-size.list with its length and may shrink and never
      # grow; a shrink passes, and ratchet-tighten.yml lowers the entry on main.
      - name: file-size / File-size ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/file-size.sh --self-test
      - name: file-size / No file over the budget or past its entry
        if: ${{ !cancelled() }}
        run: bash scripts/checks/file-size.sh

      # ---- forwarders --------------------------------------------------
      # No function only forwards to another (.claude/rules/rust-style.md,
      # #972): the forwarders tools/forwarders finds in addons/*/src, app/*/src,
      # crates/*/src and tools/*/src may fall and never rise. The count and the
      # key of every counted forwarder are committed beside the guard. A rise
      # fails and names each new forwarder with its target; a fall passes, and
      # ratchet-tighten.yml lowers the count on main. No rust-cache: the tool
      # builds proc-macro2, quote and syn alone.
      - name: forwarders
        if: ${{ !cancelled() }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: forwarders / Forwarder ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/forwarders.sh --self-test
      - name: forwarders / The forwarders have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/forwarders.sh

      # ---- tree-guards -------------------------------------------------
      # dockerfile-lint — hadolint over the container recipe. The image copies a
      # prebuilt binary onto a digest-pinned base, so the rules that matter are
      # the pinned FROM, the numeric non-root USER, and the exec-form ENTRYPOINT.
      # The tree guards: every vendor fetcher writes into the tree, every
      # workspace member is named in the repo map and the architecture table,
      # every evidence citation in docs/claims.md resolves to a symbol or a test,
      # every project extension the server writes has its StructureDefinition
      # on the website, and every first-party file carries its SPDX header.
      - name: tree-guards / vendor-dests
        if: ${{ !cancelled() }}
        run: bash scripts/checks/vendor-dests.sh
      - name: tree-guards / repo-map
        if: ${{ !cancelled() }}
        run: bash scripts/checks/repo-map.sh
      - name: tree-guards / claims
        if: ${{ !cancelled() }}
        run: |
          bash scripts/checks/claims.sh --self-test
          bash scripts/checks/claims.sh
      - name: tree-guards / extension-definitions
        if: ${{ !cancelled() }}
        run: bash scripts/checks/extension-definitions.sh
      # Every first-party file carries both SPDX lines, and every header
      # names the Licensor. Each self-test runs first on a synthetic tree.
      - name: tree-guards / spdx-headers
        if: ${{ !cancelled() }}
        run: |
          bash scripts/checks/spdx-headers.sh --self-test
          bash scripts/checks/spdx-headers.sh
      - name: tree-guards / copyright-holder
        if: ${{ !cancelled() }}
        run: |
          bash scripts/checks/copyright-holder.sh --self-test
          bash scripts/checks/copyright-holder.sh
      # Every launcher that starts the server switches the usage report off.
      # The self-test runs first: it judges synthetic launchers.
      - name: tree-guards / usage-report-off
        if: ${{ !cancelled() }}
        run: |
          bash scripts/checks/usage-report-off.sh --self-test
          bash scripts/checks/usage-report-off.sh
      # The weekly pin-freshness lane reads upstream; here only its readers
      # run over fixtures and every pin row it reads is checked to exist.
      - name: tree-guards / pin-freshness self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/pin-freshness.sh --self-test

      # ---- versions ----------------------------------------------------
      # versions — the version-drift guard. Runs NOW, before any Rust exists:
      # scripts/checks/versions.sh compares every present config file against
      # docs/VERSIONS.md and skips loudly for files that have not landed yet.
      - name: versions
        if: ${{ !cancelled() }}
        run: bash scripts/checks/versions.sh

      # ---- brand -------------------------------------------------------
      # brand — the brand palette's contrast, measured rather than remembered.
      # scripts/checks/brand-contrast.sh reads assets/brand/tokens.css and fails when
      # a token's `safe:` comment or the README's table stops matching the ratio the
      # value actually has, so a colour safe for the mark is never quietly used for
      # text (WCAG 2.2 asks 4.5:1 for body text and 3:1 for a graphic).
      - name: brand
        if: ${{ !cancelled() }}
        run: bash scripts/checks/brand-contrast.sh

      # ---- code-systems ------------------------------------------------
      # code-systems — the served code systems are listed once: the book's table
      # is the source, and the README and the landing page must name every row.
      - name: code-systems
        if: ${{ !cancelled() }}
        run: bash scripts/checks/code-systems.sh

      # ---- bench-table -------------------------------------------------
      # bench-table: the README's speed and footprint table is rendered from the
      # committed benchmark records, never typed by hand.
      - name: bench-table
        if: ${{ !cancelled() }}
        run: bash scripts/checks/bench-table.sh check

      # ---- vex ---------------------------------------------------------
      # The Rust-advisory OpenVEX document is generated from deny.toml and
      # security/vex/rust-advisories.toml; this regenerates it and fails on any
      # difference, and checks every hand-written document is well-formed OpenVEX
      # (no specification governs the pairing: our own design, FerroEHR's gate).
      - name: vex / Install yq
        if: ${{ !cancelled() }}
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --proto "=https" --proto-redir "=https" --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: vex / Every accepted advisory has a published VEX justification
        if: ${{ !cancelled() }}
        run: bash scripts/checks/vex-advisories.sh
      - name: vex / The release record's coverage check refuses what it claims to refuse
        if: ${{ !cancelled() }}
        run: bash scripts/checks/vex-coverage.sh --self-test

      # ---- tracker-helpers ---------------------------------------------
      # The tracker helpers under scripts/gh/ (no specification governs them: our
      # own design). Each drives itself against a stub gh, so the self-tests need
      # no token and run on every event.
      - name: tracker-helpers
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/gh/fields.sh --self-test
          bash scripts/gh/labels.sh --self-test
          bash scripts/gh/migrate-fields.sh --self-test
          bash scripts/gh/rel.sh --self-test

      # ---- changelog ---------------------------------------------------
      # The changelog fragments under changelog.d/ (no specification governs
      # them: our own design). Every fragment's name and content is checked on
      # every event, so a malformed one never reaches the release cut that
      # assembles them, and the assembled [Unreleased] preview is held to the
      # release section's rules: Keep a Changelog types, and the Security reason
      # and advisory (CRA Annex I Part II(2), (4) and (8)). The self-tests prove
      # the checks, the assembly, the plan list and the pull-request guard below.
      - name: changelog
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/release/changelog.sh --self-test
          bash scripts/checks/changelog-guard.sh --self-test
          bash scripts/release/changelog.sh --check
          bash scripts/release/milestone.sh --self-test
          bash scripts/checks/changelog-security.sh --self-test
          bash scripts/checks/release-notes.sh --self-test
          bash scripts/release/plan.sh --self-test
          bash scripts/checks/changelog-structure.sh
          bash scripts/release/changelog.sh --check-preview

      # ---- conflict-markers --------------------------------------------
      # No tracked file keeps an unresolved merge conflict (#1048; no
      # specification governs the guard: our own design).
      - name: conflict-markers / The guard refuses each marker and skips the vendored trees
        if: ${{ !cancelled() }}
        run: bash scripts/checks/conflict-markers.sh --self-test
      - name: conflict-markers
        if: ${{ !cancelled() }}
        run: bash scripts/checks/conflict-markers.sh

  # ── Tier 2: the Rust lanes (guarded on the workspace existing) ──────────────

  # The one thing that decides whether the cargo tier runs at all. It checks
  # out and looks for a root Cargo.toml; every Rust job below `needs` it.
  detect:
    name: detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.check.outputs.cargo }}
      perf: ${{ steps.perf.outputs.perf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The first parent of a pull request's merge commit and of a merge
          # group's commit is its base, which the perf probe diffs against.
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml present — the Rust lanes will run."
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml — the Rust lanes are skipped (repository in discovery)."
          fi
      # The performance gate runs on a push to main, on a dispatch, and on a
      # pull request or merge group that changes what the two services are
      # built from or what the gate reads (#1151).
      - id: perf
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          perf=true
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            if ! grep -qE '^(app/ferroterm-server/|app/ferroterm-sync/|addons/|crates/|tools/ferroterm-testkit/|e2e/fixtures/codesystems/|perf/|scripts/perf/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|docs/VERSIONS\.md$|\.github/workflows/(ci|perf)\.yml$|\.github/actions/setup-rust/)' <<< "$changed"; then
              perf=false
            fi
          fi
          echo "perf=$perf" >> "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The fuzz crate sits outside the workspace, so the run above never
      # compiles it; a check needs no sanitizer and runs on the pinned stable.
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass
      # nextest does not run doctests; run them as their own compile.
      - run: cargo test --doc --workspace --locked

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The [workspace.lints.rustdoc] levels apply to every `cargo doc`; -D
      # turns a broken intra-doc link into a failed build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      # Reads the same RustSec advisory DB as cargo-audit and adds
      # yanked/licenses/bans/sources, so no separate cargo-audit job exists.
      - run: cargo deny check
      # An exception in deny.toml that no longer names a finding fails, so the
      # published VEX justification never outlives the advisory it argues.
      - name: Every advisory exception still names a finding
        run: bash scripts/checks/advisory-exceptions.sh
      # Each VEX statement's dependency path against the graph cargo resolves.
      - name: Every VEX statement names the paths cargo resolves
        run: bash scripts/checks/vex-reachability.sh

  # The console is a FHIR client and links no crate from this workspace, so
  # anything it can do a client can do. One dependency edge into the engine
  # would break that silently, so the resolved closure is walked here.
  console-boundary:
    name: console-boundary
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/checks/console-boundary.sh

  # The server answers requests and reads its indexes; it connects to nothing,
  # so its dependency tree carries no HTTP client. The ICD-API walker is the one
  # client in the workspace and sits behind the icd11 crate's `api` feature,
  # which only the offline build tool turns on.
  no-client-in-server:
    name: no-client-in-server
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/checks/no-client-in-server.sh

  # An add-on is code the sync service compiles in and nothing else links, so
  # the tree stays whole when an add-on is dropped and one add-on never reaches
  # into another. The self-test runs first: it judges synthetic metadata, so it
  # says the guard still bites on a tree where every real edge is legal.
  addon-boundary:
    name: addon-boundary
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/checks/addon-boundary.sh --self-test
      - run: bash scripts/checks/addon-boundary.sh

  # A screen names a role and a step from the token layer, never a palette
  # entry. The palette is measured once by the accessibility battery, and a
  # colour written into a screen escapes that measurement silently.
  console-tokens:
    name: console-tokens
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/console-tokens.sh

  # The console's browser journeys (no specification governs them: our own
  # design). A unit test sees none of what a reader sees: a page the server
  # drew and FerroUI's modules ran over, or the same page with them refused.
  # This job builds the server and the console, starts them on loopback
  # with the stub identity provider, and drives Chrome for Testing at the
  # release docs/VERSIONS.md pins through chromedriver. Rust only: the
  # no-JavaScript mandate covers the test suite as well as the product.
  #
  # The journeys live in e2e/, outside the workspace for the reason that
  # manifest records, so the fmt and clippy passes the workspace lanes give
  # every other crate are run here by manifest path.
  ui-e2e:
    name: ui-e2e
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: ui-e2e
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: Install Chrome and chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 157.0.8103.38
          install-chromedriver: true
      - name: The journeys hold the same formatting and lint bar
        run: |
          set -euo pipefail
          cargo fmt --manifest-path e2e/Cargo.toml --check
          cargo clippy --manifest-path e2e/Cargo.toml --locked --all-targets -- -D warnings
      - name: The pseudo-locale the review can draw in proves itself
        run: bash scripts/pseudo-locale.sh --self-test
      - run: bash scripts/ui-e2e.sh
        env:
          FERROTERM_UI_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROTERM_UI_E2E_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
      # What the browser was looking at when a journey failed: a screenshot and
      # the whole document, per failed wait, and under logs/ what the servers,
      # the consoles, the issuer and chromedriver logged. A passing run writes
      # nothing, so this attaches only where there is something to look at.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-e2e-failure
          path: target/ui-e2e-failures
          if-no-files-found: ignore
          retention-days: 14

  # A pull request records its user-visible effect as a fragment under
  # changelog.d/, or as an edit of CHANGELOG.md while pull requests opened
  # before the fragments still land. `no-changelog` is the escape for a change
  # with no user-visible effect. Bots are skipped by author type: a dependency
  # or pin bump carries no entry of its own. The script diffs from the merge
  # base of the two shas, so the full history is fetched.
  changelog-guard:
    name: changelog-guard
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The pull request carries a changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#848).
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-changelog")')" = true ]; then
            echo "the no-changelog label is set: the guard does not apply"
            exit 0
          fi
          bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"

  # The crate-line bump rule (.claude/rules/crates-publishing.md): a PR that
  # changes packaged content of a crates/* member bumps the lockstep crate
  # version in the same PR. The `no-crate-bump` label is the escape for a diff
  # that provably does not alter packaged bytes.
  crate-version-guard:
    name: crate-version-guard
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Crate-version guard self-test
        run: bash scripts/checks/crate-version-guard.sh --self-test
      # The base is the target branch as fetched now, and the guard diffs
      # from its merge base with the head, so a crate change the target
      # gained after the fork is not counted.
      - id: guard-pr
        name: Packaged crate content moved with its version
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#848).
          if [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-crate-bump")')" = true ]; then
            echo "the no-crate-bump label is set: the guard does not apply"
            exit 0
          fi
          bash scripts/checks/crate-version-guard.sh "origin/$BASE_REF" "$HEAD"
      # The queue builds each entry onto the one ahead of it and names that as
      # the base, so the diff is this entry's change alone. The group ref names
      # the pull request (`gh-readonly-queue/main/pr-<n>-<sha>`), whose label
      # is the same escape.
      - id: guard-queue
        name: The queued change moves the crate line above the queue base
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          pr="$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<<"$GROUP_REF")"
          if [[ -n "$pr" ]] && gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx 'no-crate-bump'; then
            echo "the no-crate-bump label is set on #$pr: the guard does not apply"
            exit 0
          fi
          bash scripts/checks/crate-version-guard.sh "$BASE_SHA" "$HEAD_SHA"
      - uses: ./.github/actions/setup-rust
        if: steps.guard-pr.outputs.judged != '' || steps.guard-queue.outputs.judged != ''
        with:
          cache-key: semver
      - id: semver-pin
        name: Read the cargo-semver-checks pin
        if: steps.guard-pr.outputs.judged != '' || steps.guard-queue.outputs.judged != ''
        run: echo "version=$(bash scripts/checks/semver.sh --pin)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.guard-pr.outputs.judged != '' || steps.guard-queue.outputs.judged != ''
        with:
          tool: cargo-semver-checks@${{ steps.semver-pin.outputs.version }}
      # The checkout is the change merged onto its base, so the judge compares
      # the base's public API with the one the merge would leave (#1208).
      - name: Each published crate's version answers its change (cargo-semver-checks)
        if: steps.guard-pr.outputs.judged != '' || steps.guard-queue.outputs.judged != ''
        env:
          JUDGED: ${{ steps.guard-pr.outputs.judged }}${{ steps.guard-queue.outputs.judged }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.event.pull_request.base.ref) }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one crate name per word by construction
          bash scripts/checks/semver.sh --baseline-rev "$BASE" $JUDGED

  # Every publishable crate packages and verifies as crates.io would build it
  # (no cache: the dry run verifies the bytes a publish would upload).
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      # The upload order derived from the dependency graph, the refusals, and
      # the bounded sparse-index wait, offline (#1114).
      - run: bash scripts/release/publish-crates.sh self-test
      - run: cargo publish --workspace --dry-run --locked

  # The latency bars, measured over the generated edition so the lane needs no
  # licensed release. A bar is the claim, never a machine's measurement:
  # bench/bars.json holds the claims and the script fails on a breach.
  bench-bars:
    name: bench-bars
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-bars
      - run: scripts/checks/bench-bars.sh
      # The served bar is about what a real code system answers with, so it is
      # read from the committed record set rather than measured here. A set
      # taken before the harness recorded answer sizes skips loudly.
      - run: scripts/checks/served-bars.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-bars
          path: target/criterion/*/*/new/estimates.json
          retention-days: 14

  msrv:
    name: msrv (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-hack
      # The Cargo book's named tool for verifying the declared rust-version
      # (reads the workspace `rust-version`).
      - run: cargo hack check --rust-version --workspace --locked --all-targets

  # The HL7 terminology ecosystem suite against a release build, with the
  # committed pass list as the gate (conformance/tx-ecosystem/README.md). The
  # runner is the FHIR Validator, a JVM in CI only; the server never has one.
  # The performance gate (#1151, #1160): ferrohealth-perf's A/B mode, the
  # release builds of the server and the sync service judged against the
  # builds of their base on the same runner, in perf.yml, which the release
  # lane calls on the release commit too. The base is the pull request's
  # base or the commit before a push; a dispatch takes the previous release.
  # A merge group builds nothing for it and its verdict passes with a
  # summary saying why (#1186).
  perf:
    name: perf
    needs: detect
    if: needs.detect.outputs.cargo == 'true' && needs.detect.outputs.perf == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/perf.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      skip: ${{ github.event_name == 'merge_group' }}

  tx-ecosystem:
    name: tx-ecosystem
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: tx-ecosystem
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo build --release --locked -p ferroterm-server
      - run: scripts/checks/tx-ecosystem.sh
      - run: scripts/checks/tx-ecosystem.sh --fhir r4 --out target/tx-ecosystem/out-r4
      - run: scripts/checks/tx-ecosystem.sh --fhir r5 --out target/tx-ecosystem/out-r5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tx-ecosystem-report
          path: |
            target/tx-ecosystem/out/report.json
            target/tx-ecosystem/out/runner.log
            target/tx-ecosystem/out/passing.txt
            target/tx-ecosystem/out/expected
            target/tx-ecosystem/out/actual
            target/tx-ecosystem/out-r4/report.json
            target/tx-ecosystem/out-r4/runner.log
            target/tx-ecosystem/out-r4/passing.txt
            target/tx-ecosystem/out-r5/report.json
            target/tx-ecosystem/out-r5/runner.log
            target/tx-ecosystem/out-r5/passing.txt
          retention-days: 14

  dependency-review:
    name: dependency-review
    needs: detect
    # Pull requests only: the action compares the base..head dependency graph,
    # which a push has no diff for. Guarded on the workspace so it stays quiet
    # in discovery.
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a PR that introduces a vulnerable or disallowed-license
          # dependency. License policy mirrors deny.toml.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── The single required check ───────────────────────────────────────────────

  conclusion:
    name: conclusion
    needs:
      - lint
      - guards
      - detect
      - fmt
      - clippy
      - test
      - doc
      - cargo-deny
      - console-boundary
      - addon-boundary
      - console-tokens
      - no-client-in-server
      - ui-e2e
      - crate-version-guard
      - changelog-guard
      - publish-dry-run
      - msrv
      - bench-bars
      - tx-ecosystem
      - perf
      - dependency-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
