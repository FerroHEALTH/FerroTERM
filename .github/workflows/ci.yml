# SPDX-License-Identifier: BUSL-1.1

# CI — two tiers.
#
#   1. The workflows/shell tier runs NOW, on an empty (pre-code) repository:
#      actionlint + zizmor over .github/workflows, and shellcheck over the
#      tracked shell scripts. These are the checks that keep this very file
#      honest, so they must never depend on Rust existing.
#   2. The Rust tier is GUARDED behind a detection job that checks for a
#      Cargo.toml. Every cargo lane is skipped cleanly until the workspace
#      lands, then activates by itself — no workflow edit needed. (hashFiles()
#      cannot gate a job at `if:` time because the workspace is empty before
#      checkout, so a real detection job is the correct primitive.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` re-runs the contribution-licence guard when the checkbox is
    # ticked. `labeled` and `unlabeled` too: the label escapes
    # (`no-crate-bump`, `no-changelog`) are read from the event payload, so a
    # label added after the run started takes effect without a new push.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ── Tier 1: the workflow + shell checks (always run) ────────────────────────

  # zizmor (docs.zizmor.sh) — static security analysis for GitHub Actions, the
  # machine check behind three hard properties here: every `uses:` hash-pinned
  # (unpinned-uses), no checkout persisting credentials without a recorded
  # exception (artipacked), and no context value spliced into a shell
  # (template-injection).
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: zizmor@1.30.1
      - name: Audit .github/workflows
        # GH_TOKEN enables the ONLINE audits: impostor-commit verifies that a
        # pinned commit really belongs to the repository named in front of it,
        # which it cannot do offline. --min-severity=low gates every actionable
        # tier and leaves the informational tier advisory.
        #
        # The online audit reaches GitHub once per pinned action, and a
        # transient 5xx there surfaces as exit code 1, the tool-failure code
        # (docs.zizmor.sh/usage). Only that code is retried: a clean run (0)
        # and a finding (11 to 14) return on the first attempt, so the retry
        # can never hide an audit result.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            status=0
            zizmor --config .github/zizmor.yml --min-severity=low .github/workflows/ || status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::zizmor failed with a tool error (attempt ${attempt}/3); retrying"
              sleep $((attempt * 15))
            fi
          done
          exit 1

  # actionlint — the CORRECTNESS half of the pair: `${{ }}` expressions that
  # cannot evaluate, `needs:` naming a job that does not exist, unknown runner
  # labels, and shellcheck over every embedded `run:` block.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The OFFICIAL image, digest-pinned. actionlint is a Go binary (not a
        # crate), and its own README's alternative is `curl | bash` off main —
        # exactly the unpinned fetch this repository's pinning rule forbids.
        # The image also BUNDLES shellcheck, which half of actionlint's value
        # depends on.
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence here is a `printf` format or a `jq` filter,
        # where single quotes are the correct idiom.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # shellcheck over the tracked shell scripts — every CI guard, vendor fetcher,
  # and hook. `--severity=style` is the lowest floor, so everything gates: a
  # finding is fixed, or carries a per-line `# shellcheck disable=SCnnnn`
  # directive with its reason. No .shellcheckrc, deliberately — nothing may turn
  # a code off tree-wide.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The upstream RELEASE binary, pinned by version — not the runner's distro
      # package, which moves under us at every runner-image refresh. Fetched by
      # the same SHA-pinned installer, which verifies the checksum.
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: |
          set -euo pipefail
          # Every tracked *.sh, plus every tracked extensionless file whose
          # first line is a shell shebang (covers git hooks). A NUL-delimited
          # pipe so paths with spaces survive.
          {
            git ls-files -z '*.sh'
            git ls-files -z | while IFS= read -r -d '' f; do
              case "$f" in
                *.*) ;;
                *) head -c2 "$f" 2>/dev/null | grep -q '#!' \
                     && head -n1 "$f" | grep -qE 'sh$' && printf '%s\0' "$f" ;;
              esac
            done
          } | { grep -zc . >/dev/null && xargs -0 -r shellcheck --severity=style; } \
            || echo "no shell files to check"

  # comment-style: the RFC 505 / RFC 1574 comment budgets over every
  # hand-written .rs file. The per-edit hook runs the same script on the files
  # it just touched, which says nothing about a file an editor changed outside
  # the hook, so the whole tree is swept here. It reads the checkout and needs
  # no toolchain, which is why it sits in tier 1.
  comment-style:
    name: comment-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/comment-style.sh --all

  # dockerfile-lint — hadolint over the container recipe. The image copies a
  # prebuilt binary onto a digest-pinned base, so the rules that matter are
  # the pinned FROM, the numeric non-root USER, and the exec-form ENTRYPOINT.
  # The tree guards: every vendor fetcher writes into the tree, every
  # workspace member is named in the repo map and the architecture table,
  # every evidence citation in docs/claims.md resolves to a symbol or a test,
  # and every project extension the server writes has its StructureDefinition
  # on the website.
  tree-guards:
    name: tree-guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: vendor-dests
        run: bash scripts/checks/vendor-dests.sh
      - name: repo-map
        run: bash scripts/checks/repo-map.sh
      - name: claims
        run: bash scripts/checks/claims.sh
      - name: extension-definitions
        run: bash scripts/checks/extension-definitions.sh

  dockerfile-lint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every Dockerfile in the tree, under the .hadolint.yaml configuration.
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: .hadolint.yaml
      # A recipe with a suffix is named on its own: the recursive pattern above
      # matches the name exactly, and a wildcard would also catch a
      # `.dockerignore` beside one, which is not a Dockerfile.
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile.sync
          config: .hadolint.yaml

  # versions — the version-drift guard. Runs NOW, before any Rust exists:
  # scripts/checks/versions.sh compares every present config file against
  # docs/VERSIONS.md and skips loudly for files that have not landed yet.
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/versions.sh

  # brand — the brand palette's contrast, measured rather than remembered.
  # scripts/checks/brand-contrast.sh reads assets/brand/tokens.css and fails when
  # a token's `safe:` comment or the README's table stops matching the ratio the
  # value actually has, so a colour safe for the mark is never quietly used for
  # text (WCAG 2.2 asks 4.5:1 for body text and 3:1 for a graphic).
  brand:
    name: brand
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/brand-contrast.sh

  # code-systems — the served code systems are listed once: the book's table
  # is the source, and the README and the landing page must name every row.
  code-systems:
    name: code-systems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/code-systems.sh

  # bench-table: the README's speed and footprint table is rendered from the
  # committed benchmark records, never typed by hand.
  bench-table:
    name: bench-table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/bench-table.sh check

  # ── Tier 2: the Rust lanes (guarded on the workspace existing) ──────────────

  # The one thing that decides whether the cargo tier runs at all. It checks
  # out and looks for a root Cargo.toml; every Rust job below `needs` it.
  detect:
    name: detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.check.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml present — the Rust lanes will run."
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml — the Rust lanes are skipped (repository in discovery)."
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass
      # nextest does not run doctests; run them as their own compile.
      - run: cargo test --doc --workspace --locked

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The [workspace.lints.rustdoc] levels apply to every `cargo doc`; -D
      # turns a broken intra-doc link into a failed build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny
      # Reads the same RustSec advisory DB as cargo-audit and adds
      # yanked/licenses/bans/sources, so no separate cargo-audit job exists.
      - run: cargo deny check

  # The viewer is a FHIR client and links no crate from this workspace, so
  # anything it can do a client can do. One dependency edge into the engine
  # would break that silently, so the resolved closure is walked here.
  viewer-boundary:
    name: viewer-boundary
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/checks/viewer-boundary.sh

  # The server answers requests and reads its indexes; it connects to nothing,
  # so its dependency tree carries no HTTP client. The ICD-API walker is the one
  # client in the workspace and sits behind the icd11 crate's `api` feature,
  # which only the offline build tool turns on.
  no-client-in-server:
    name: no-client-in-server
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/checks/no-client-in-server.sh

  # An add-on is code the sync service compiles in and nothing else links, so
  # the tree stays whole when an add-on is dropped and one add-on never reaches
  # into another. The self-test runs first: it judges synthetic metadata, so it
  # says the guard still bites on a tree where every real edge is legal.
  addon-boundary:
    name: addon-boundary
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/checks/addon-boundary.sh --self-test
      - run: bash scripts/checks/addon-boundary.sh

  # A screen names a role and a step from the token layer, never a palette
  # entry. The palette is measured once by the accessibility battery, and a
  # colour written into a screen escapes that measurement silently.
  viewer-tokens:
    name: viewer-tokens
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/viewer-tokens.sh

  # The viewer ships to a browser, so the target it must compile for is
  # wasm32-unknown-unknown and no ordinary workspace lane covers it. The wasm
  # clippy pass is the load-bearing gate here: it is the only place a
  # dependency that cannot compile for the browser shows up. The bundle build
  # and the size bar follow it, so a fatter download is a decision someone
  # makes rather than a drift nobody sees.
  #
  # Three tool pins, each from its recorded home (docs/VERSIONS.md):
  # Trunk 0.21.14 below, leptosfmt 0.1.33 below, and the Tailwind standalone
  # CLI 4.3.3 in app/ferroterm-viewer/Trunk.toml `[tools] tailwindcss`, which
  # Trunk downloads itself at that version. There is no Node in this build.
  viewer:
    name: viewer
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Full history: the bundle's per-change budget is measured against the
      # figure the MERGE BASE recorded, which the guard reads out of git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: viewer
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: trunk@0.21.14, cargo-nextest
      # leptosfmt is not in install-action's manifest, so install-action would
      # fall back to cargo-binstall guessing an asset name. A version-pinned
      # `cargo install --locked` is the deterministic build of the same tool.
      - name: Install leptosfmt
        run: cargo install leptosfmt --locked --version 0.1.33
      - name: Formatting
        run: |
          set -euo pipefail
          cargo fmt -p ferroterm-viewer --check
          leptosfmt --check app/ferroterm-viewer/src
      # Both feature sets, because the crate ships as two bundles and the
      # reader's build is the one a feature-gated screen could break without
      # anyone noticing.
      - name: Clippy on the target the crate ships to
        run: |
          set -euo pipefail
          cargo clippy -p ferroterm-viewer --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo clippy -p ferroterm-viewer --locked --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings
      - name: Tests
        run: |
          set -euo pipefail
          cargo nextest run -p ferroterm-viewer --locked --no-tests=pass
          cargo nextest run -p ferroterm-viewer --locked --features editor --no-tests=pass
      # `locked = true` in Trunk.toml already refuses a stale lock file; the
      # flag says so at the call site too. The editor build is the same crate
      # with the feature on, into its own directory and under its own mount
      # (trunk 0.21.14 `build --features/--dist/--public-url`).
      - name: Build both release bundles
        working-directory: app/ferroterm-viewer
        run: |
          set -euo pipefail
          trunk build --release --locked
          trunk build --release --locked --features editor --dist dist-editor --public-url /ui/editor/
      # BASE is empty outside a pull request, and the guard then checks only
      # the ceilings and says so. Only a pull request reaches `main`.
      - name: Each bundle is inside its ceiling and its per-change budget
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          reader=(--bars app/ferroterm-viewer/bundle-size.json --dist app/ferroterm-viewer/dist)
          editor=(--bars app/ferroterm-viewer/bundle-size-editor.json --dist app/ferroterm-viewer/dist-editor)
          if [[ -n "${BASE:-}" ]]; then
            bash scripts/checks/bundle-size.sh "${reader[@]}" --base "$BASE"
            bash scripts/checks/bundle-size.sh "${editor[@]}" --base "$BASE"
          else
            bash scripts/checks/bundle-size.sh "${reader[@]}"
            bash scripts/checks/bundle-size.sh "${editor[@]}"
          fi

  # The viewer is client-side rendered, so a unit test sees none of what a
  # reader sees: the document is an empty <body> until the WebAssembly bundle
  # boots. This job is the only place the bundle is proved to render at all. It
  # builds the bundle, embeds it in the server, builds the image from
  # docker/Dockerfile the way the release lane stages it, and drives that image
  # with a pinned headless Chromium. Rust only: Playwright is JavaScript, and
  # the no-JavaScript mandate covers the test suite as well as the product.
  #
  # The journeys live in e2e/, outside the workspace for the reason that
  # manifest records, so the fmt and clippy passes the workspace lanes give
  # every other crate are run here by manifest path.
  ui-e2e:
    name: ui-e2e
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: ui-e2e
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      # The image base is distroless/static, so the binaries the journeys drive
      # are linked against musl, as release-build.yml links the ones it ships.
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: trunk@0.21.14, cargo-nextest
      - name: The journeys hold the same formatting and lint bar
        run: |
          set -euo pipefail
          cargo fmt --manifest-path e2e/Cargo.toml --check
          cargo clippy --manifest-path e2e/Cargo.toml --locked --all-targets -- -D warnings
      # The browser is a container pinned by digest inside the script, so the
      # runner image's own Chrome never decides what the journeys drive.
      - run: bash scripts/ui-e2e.sh
      # What the browser was looking at when a journey failed: a screenshot and
      # the whole document, per failed wait. A passing run writes nothing, so
      # this attaches only where there is something to look at, and a run that
      # failed before the journeys started attaches nothing either.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ui-e2e-failure
          path: target/ui-e2e-failures
          if-no-files-found: ignore
          retention-days: 14

  # The tracker helpers under scripts/gh/ (no specification governs them: our
  # own design). Each drives itself against a stub gh, so the self-tests need
  # no token and run on every event.
  tracker-helpers:
    name: tracker-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/gh/fields.sh --self-test
          bash scripts/gh/labels.sh --self-test
          bash scripts/gh/migrate-fields.sh --self-test
          bash scripts/gh/rel.sh --self-test

  # The changelog fragments under changelog.d/ (no specification governs
  # them: our own design). Every fragment's name and content is checked on
  # every event, so a malformed one never reaches the release cut that
  # assembles them. The self-tests prove the check, the assembly and the
  # pull-request guard below over stub repositories.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash scripts/release/changelog.sh --self-test
          bash scripts/checks/changelog-guard.sh --self-test
          bash scripts/release/changelog.sh --check

  # A pull request records its user-visible effect as a fragment under
  # changelog.d/, or as an edit of CHANGELOG.md while pull requests opened
  # before the fragments still land. `no-changelog` is the escape for a change
  # with no user-visible effect. Bots are skipped by author type: a dependency
  # or pin bump carries no entry of its own. The script diffs from the merge
  # base of the two shas, so the full history is fetched.
  changelog-guard:
    name: changelog-guard
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.type != 'Bot'
      && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The pull request carries a changelog entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"

  # The crate-line bump rule (.claude/rules/crates-publishing.md): a PR that
  # changes packaged content of a crates/* member bumps the lockstep crate
  # version in the same PR. The `no-crate-bump` label is the escape for a diff
  # that provably does not alter packaged bytes.
  crate-version-guard:
    name: crate-version-guard
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-crate-bump')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Packaged crate content moved with its version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  # Every publishable crate packages and verifies as crates.io would build it
  # (no cache: the dry run verifies the bytes a publish would upload).
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: cargo publish --workspace --dry-run --locked

  # The latency bars, measured over the generated edition so the lane needs no
  # licensed release. A bar is the claim, never a machine's measurement:
  # bench/bars.json holds the claims and the script fails on a breach.
  bench-bars:
    name: bench-bars
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-bars
      - run: scripts/checks/bench-bars.sh
      # The served bar is about what a real code system answers with, so it is
      # read from the committed record set rather than measured here. A set
      # taken before the harness recorded answer sizes skips loudly.
      - run: scripts/checks/served-bars.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-bars
          path: target/criterion/*/*/new/estimates.json
          retention-days: 14

  msrv:
    name: msrv (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-hack
      # The Cargo book's named tool for verifying the declared rust-version
      # (reads the workspace `rust-version`).
      - run: cargo hack check --rust-version --workspace --locked --all-targets

  # The HL7 terminology ecosystem suite against a release build, with the
  # committed pass list as the gate (conformance/tx-ecosystem/README.md). The
  # runner is the FHIR Validator, a JVM in CI only; the server never has one.
  tx-ecosystem:
    name: tx-ecosystem
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: tx-ecosystem
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo build --release --locked -p ferroterm-server
      - run: scripts/checks/tx-ecosystem.sh
      - run: scripts/checks/tx-ecosystem.sh --fhir r4 --out target/tx-ecosystem/out-r4
      - run: scripts/checks/tx-ecosystem.sh --fhir r5 --out target/tx-ecosystem/out-r5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tx-ecosystem-report
          path: |
            target/tx-ecosystem/out/report.json
            target/tx-ecosystem/out/runner.log
            target/tx-ecosystem/out/passing.txt
            target/tx-ecosystem/out/expected
            target/tx-ecosystem/out/actual
            target/tx-ecosystem/out-r4/report.json
            target/tx-ecosystem/out-r4/runner.log
            target/tx-ecosystem/out-r4/passing.txt
            target/tx-ecosystem/out-r5/report.json
            target/tx-ecosystem/out-r5/runner.log
            target/tx-ecosystem/out-r5/passing.txt
          retention-days: 14

  dependency-review:
    name: dependency-review
    needs: detect
    # Pull requests only: the action compares the base..head dependency graph,
    # which a push has no diff for. Guarded on the workspace so it stays quiet
    # in discovery.
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a PR that introduces a vulnerable or disallowed-license
          # dependency. License policy mirrors deny.toml.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── The single required check ───────────────────────────────────────────────

  # conclusion — the one status check the branch ruleset requires. It `needs`
  # every other job and runs on `always()`, so it reports even when a guarded
  # Rust lane is skipped pre-code. It fails if any needed job FAILED or was
  # CANCELLED, and passes when every result is `success` or `skipped`. The
  # results arrive through `env:` (never spliced into `run:`, per the
  # workflow-security rule).
  # A person's pull request records acceptance of the contribution licensing
  # terms (CONTRIBUTING.md § Licensing of contributions) through the template's
  # checkbox; this gate is what makes the checkbox binding. Bot authors are
  # skipped: a bot cannot accept terms and its bumps carry no expression of its
  # own. `edited` is in the pull_request trigger so ticking the box re-runs it.
  contribution-licence:
    name: contribution-licence-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pull request body accepts the contribution licensing terms
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/checks/contribution-licence.sh

  conclusion:
    name: conclusion
    needs:
      - contribution-licence
      - workflow-audit
      - workflow-lint
      - shellcheck
      - comment-style
      - tree-guards
      - dockerfile-lint
      - versions
      - brand
      - code-systems
      - bench-table
      - detect
      - fmt
      - clippy
      - test
      - doc
      - cargo-deny
      - viewer-boundary
      - addon-boundary
      - viewer-tokens
      - no-client-in-server
      - viewer
      - ui-e2e
      - crate-version-guard
      - tracker-helpers
      - changelog
      - changelog-guard
      - publish-dry-run
      - msrv
      - bench-bars
      - tx-ecosystem
      - dependency-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
