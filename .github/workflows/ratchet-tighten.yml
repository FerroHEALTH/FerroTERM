# Ratchet tighten (#954, #950, #971, #972). No specification governs this:
# our own design.
#
# The ratchet guards (scripts/checks/duplication.sh, file-size.sh,
# stray-literals.sh and forwarders.sh) fail a rise and pass a fall with a
# note, so a pull request that removes duplication, shortens a file, moves
# strings to the catalogs or removes a forwarder touches none of the shared
# ratchet files and conflicts with no other open pull request. This lane does
# the tightening instead: once a day it runs each guard's --update on main
# and pushes one branch, chore/ratchet-tighten, that holds only the ratchet
# files, or moves an open pull request on it to the new counts. When nothing
# fell it does nothing.
#
# It never pushes to main. The commit is made through the Git Data REST API,
# so GitHub signs it and it shows Verified
# (docs.github.com/en/rest/git/commits, "Signature verification"). Every
# request body goes through a file with `gh api --input`: a ratchet file's
# base64 content passed as one argument exceeds the kernel's limit
# (FerroHEALTH/FerroEHR#4790).
#
# THE HAND-OFF. The organisation keeps "Allow GitHub Actions to create and
# approve pull requests" off and the lane carries no separate token, so it
# ends with a notice once the branch is pushed and a maintainer opens the pull
# request from it (FerroHEALTH/FerroEHR#4797).
name: Ratchet tighten

on:
  schedule:
    # Daily 04:53 UTC, off the hour and in a slot of its own; read the
    # estate's slots with `grep -rE '^ +- cron:' .github/workflows/`.
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ratchet-tighten
  cancel-in-progress: false

jobs:
  tighten:
    name: tighten
    # The counts are main's; a dispatch from another branch would lower them
    # to that branch's tree.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the blob, tree, commit and branch ref
      pull-requests: read # find an open pull request on the lane's branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # forwarders.sh builds tools/forwarders with the pinned toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      # A rise on main is a failure for a person to look at, never a count
      # this lane writes down.
      - name: No ratchet has risen on main
        run: |
          set -euo pipefail
          bash scripts/checks/duplication.sh
          bash scripts/checks/file-size.sh
          bash scripts/checks/stray-literals.sh app/ferroterm-console/src
          bash scripts/checks/forwarders.sh

      - name: Lower the counts
        id: update
        run: |
          set -euo pipefail
          count_before=$(git show HEAD:scripts/checks/duplication.count | awk '/^[[:space:]]*(#|$)/ { next } { print; exit }')
          bash scripts/checks/duplication.sh --update
          count_after=$(awk '/^[[:space:]]*(#|$)/ { next } { print; exit }' scripts/checks/duplication.count)
          # A block that moved and kept the count changes only its key, which
          # the check already tolerates; that alone is no reason for a PR.
          if [ "$count_before" = "$count_after" ]; then
            git checkout -- scripts/checks/duplication.count scripts/checks/duplication-baseline.txt
          fi
          bash scripts/checks/file-size.sh --update
          bash scripts/checks/stray-literals.sh --update app/ferroterm-console/src
          forwarders_before=$(git show HEAD:scripts/checks/forwarders.count | awk '/^[[:space:]]*(#|$)/ { next } { print; exit }')
          bash scripts/checks/forwarders.sh --update
          forwarders_after=$(awk '/^[[:space:]]*(#|$)/ { next } { print; exit }' scripts/checks/forwarders.count)
          # As for duplication: a key that moved with the count unchanged is no reason for a PR.
          if [ "$forwarders_before" = "$forwarders_after" ]; then
            git checkout -- scripts/checks/forwarders.count scripts/checks/forwarders-baseline.txt
          fi

          git diff --name-only -- \
            scripts/checks/duplication.count scripts/checks/duplication-baseline.txt \
            scripts/checks/file-size.list scripts/checks/stray-literals.baseline \
            scripts/checks/forwarders.count scripts/checks/forwarders-baseline.txt >changed-files.txt
          other=$(git status --porcelain --untracked-files=no | awk '{ print $2 }' | grep -vxF -f changed-files.txt || true)
          if [ -n "$other" ]; then
            echo "$other"
            echo "::error::--update changed a file outside the ratchet files."
            exit 1
          fi
          if [ ! -s changed-files.txt ]; then
            echo "::notice::No ratchet fell. Nothing to do."
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=1" >>"$GITHUB_OUTPUT"
          {
            echo "duplication_before=$count_before"
            echo "duplication_after=$count_after"
            echo "forwarders_before=$forwarders_before"
            echo "forwarders_after=$forwarders_after"
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Ratchet files lowered'
            echo
            echo '```diff'
            git diff --stat
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Push or move the tightening branch
        if: steps.update.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          DUP_BEFORE: ${{ steps.update.outputs.duplication_before }}
          DUP_AFTER: ${{ steps.update.outputs.duplication_after }}
          FWD_BEFORE: ${{ steps.update.outputs.forwarders_before }}
          FWD_AFTER: ${{ steps.update.outputs.forwarders_after }}
        run: |
          set -euo pipefail
          branch="chore/ratchet-tighten"
          title="chore(checks): lower the ratchet counts"

          # The parent is the commit the counts were measured on, so the
          # lowered counts hold for it; CI on the pull request measures them
          # again against main as it is at merge time.
          base_tree=$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq .tree.sha)
          : >tree-entries.jsonl
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            base64 -w0 "$f" | jq -Rs '{encoding: "base64", content: .}' >blob.json
            blob=$(gh api "repos/${REPO}/git/blobs" --input blob.json --jq .sha)
            jq -nc --arg path "$f" --arg sha "$blob" \
              '{path: $path, mode: "100644", type: "blob", sha: $sha}' >>tree-entries.jsonl
            echo "staged $f ($blob)"
          done <changed-files.txt
          jq -s --arg base "$base_tree" '{base_tree: $base, tree: .}' tree-entries.jsonl >tree.json
          tree=$(gh api "repos/${REPO}/git/trees" --input tree.json --jq .sha)
          jq -n --arg message "$title" --arg tree "$tree" --arg parent "$BASE_SHA" \
            '{message: $message, tree: $tree, parents: [$parent]}' >commit.json
          commit=$(gh api "repos/${REPO}/git/commits" --input commit.json --jq .sha)

          # One pull request at a time: an open one moves to the new commit,
          # which is this lane's own branch and never main.
          open=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            jq -n --arg sha "$commit" '{sha: $sha, force: true}' >ref.json
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${branch}" --input ref.json --jq .ref
            echo "::notice::Moved #${open} to ${commit}."
            exit 0
          fi
          if gh api "repos/${REPO}/git/ref/heads/${branch}" --silent 2>/dev/null; then
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}"
          fi
          jq -n --arg ref "refs/heads/${branch}" --arg sha "$commit" '{ref: $ref, sha: $sha}' >ref.json
          gh api "repos/${REPO}/git/refs" --input ref.json --jq .ref

          {
            echo "The ratchet guards pass a fall and fail only a rise, so pull requests leave the ratchet files alone (#954, #950). This pull request records what fell on \`main\`, and carries only the ratchet files:"
            echo
            while IFS= read -r f; do echo "* \`$f\`"; done <changed-files.txt
            if [ -n "$DUP_BEFORE" ] && [ "$DUP_BEFORE" != "$DUP_AFTER" ]; then
              echo
              echo "Duplicated lines: ${DUP_BEFORE} to ${DUP_AFTER}."
            fi
            if [ -n "$FWD_BEFORE" ] && [ "$FWD_BEFORE" != "$FWD_AFTER" ]; then
              echo
              echo "Forwarders: ${FWD_BEFORE} to ${FWD_AFTER}."
            fi
            echo
            echo "Made by \`.github/workflows/ratchet-tighten.yml\` from each guard's \`--update\`. No user-visible change, so it carries the \`no-changelog\` label."
          } >pr-body.md

          # GitHub Actions may not open a pull request here, so the pushed
          # branch is the hand-off and a maintainer opens it (#971).
          echo "::notice::Pushed ${branch}; open its pull request by hand with the title \"${title}\", the label no-changelog and the body in the job summary."
          {
            echo
            echo "### Pull request to open from \`${branch}\`"
            echo
            echo "Title: \`${title}\`"
            echo
            cat pr-body.md
          } >>"$GITHUB_STEP_SUMMARY"
