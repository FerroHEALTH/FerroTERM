# SPDX-FileCopyrightText: Cadasto B.V.
# SPDX-License-Identifier: BUSL-1.1

# The console release, as a REUSABLE workflow: the static binaries
# and the site bundle built here, attested and attached to the draft release,
# and packed into ghcr.io/ferrohealth/ferroterm-console with the same
# provenance and SBOM attestations as the server image.
#
# It is a reusable workflow for the reason release-build.yml and
# release-image.yml are: SLSA v1.2 Build Level 3 needs the signing identity
# out of reach of caller-defined steps, and a `workflow_call` job runs on a VM
# a caller cannot add steps to
# (https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3).
#
# Three jobs. `binary` builds the musl console binary with cargo auditable on
# a runner of each architecture, and `site` builds the architecture-independent
# site bundle with cargo-leptos; each attests what it built and attaches it to
# the draft. `image` verifies both against this workflow's signer identity
# before it stages them, so the image provenance chains to attested inputs,
# then pushes the index by digest, attests the index and both platform
# manifests as OCI referrers, and verifies its own output as a consumer would.
# The index is tagged by scan-and-tag.yml only after its scan and the
# release's vulnerability record pass.
#
# Verify a published image (the tag resolves to the index):
#   gh attestation verify oci://ghcr.io/ferrohealth/ferroterm-console:<version> \
#     --repo FerroHEALTH/FerroTERM \
#     --signer-workflow FerroHEALTH/FerroTERM/.github/workflows/release-console.yml
name: Release console (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag being released.
        required: true
        type: string
      version:
        description: The tag without its leading v, which is the image tag.
        required: true
        type: string
      targets:
        description: >-
          The console's binary targets as a matrix, one {runner, target, arch}
          per image platform, the set release.yml's finalize job checks.
        required: true
        type: string
    outputs:
      digest:
        description: The digest of the pushed image index.
        value: ${{ jobs.image.outputs.digest }}
      tags:
        description: >-
          The newline-separated tag list the metadata step computed. The index
          is pushed by digest with no tag; release.yml applies these through
          scan-and-tag.yml once the image's scan and the release's
          vulnerability record pass.
        value: ${{ jobs.image.outputs.tags }}

permissions: {}

env:
  # NOTE: an OCI reference is lowercase and github.repository_owner is FerroHEALTH, so the owner is a literal.
  IMAGE: ghcr.io/ferrohealth/ferroterm-console
  # Annotate the index as well as the manifests: GHCR reads the package
  # description from the index
  # (https://docs.docker.com/build/ci/github-actions/annotations/).
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
  # Two crates at a time, as release-build.yml builds, for the hosted
  # runner's memory (docs/ci-cd.md).
  CARGO_BUILD_JOBS: "2"

jobs:
  binary:
    name: console binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(inputs.targets) }}
    permissions:
      contents: write # attach the binary's assets to the draft release
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    steps:
      # github.sha in a called workflow is the caller's, the commit the tag
      # points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Cold by construction: a cache an untrusted run could poison must never
      # feed a release.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          target: ${{ matrix.target }}

      # musl needs its C toolchain for the link step; each target builds on a
      # runner of its own architecture, so there is no cross toolchain.
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      # cargo-auditable embeds the dependency list in the binary, which is
      # what the binary SBOM and the image SBOMs below read their crates from.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-auditable@0.7.5

      # LEPTOS_OUTPUT_NAME, the bundle name the page loads, comes from the
      # repository's .cargo/config.toml.
      - name: Build the console server
        env:
          TARGET: ${{ matrix.target }}
        run: cargo auditable build --release --locked -p ferroterm-console --bin ferroterm-console --target "$TARGET"

      - name: Package the binary with its licence, notice and readme
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="ferroterm-console-${TAG}-${TARGET}.tar.gz"
          mkdir -p pkg
          cp "target/${TARGET}/release/ferroterm-console" pkg/ferroterm-console
          cp LICENSE NOTICE pkg/
          cp app/ferroterm-console/README.md pkg/README.md
          strip pkg/ferroterm-console
          # A flat archive: the image job extracts the one member it needs by
          # name.
          tar -C pkg -czf "$asset" ferroterm-console LICENSE NOTICE README.md
          # Corruption detection, not a signature (release-build.yml).
          sha256sum "$asset" > "${asset}.sha256sum"
          cat "${asset}.sha256sum"
          {
            echo "ASSET=$asset"
            echo "CHECKSUM=${asset}.sha256sum"
          } >> "$GITHUB_ENV"

      - name: Install syft
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: syft@1.51.1
      - name: Generate the build SBOM from the shipped binary
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          build_sbom="ferroterm-console-${TAG}-${TARGET}.spdx.json"
          syft scan "file:pkg/ferroterm-console" -o "spdx-json=${build_sbom}"
          # A `pkg:cargo/` purl comes only from the `.dep-v0` section
          # cargo-auditable wrote; none means the build lost it.
          if ! jq -e '[.packages[].externalRefs[]? | select(.referenceLocator | startswith("pkg:cargo/"))] | length > 0' "$build_sbom" > /dev/null; then
            echo "::error::${build_sbom} carries no pkg:cargo purl; was the binary built with cargo auditable?" >&2
            exit 1
          fi
          echo "BUILD_SBOM=$build_sbom" >> "$GITHUB_ENV"

      - name: Attest the build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Attest the build SBOM
        id: sbom-attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.BUILD_SBOM }}

      # The bundles as release assets, for offline verification and for
      # OpenSSF Scorecard's signed-releases check, which matches the
      # `.sigstore.json` and `.intoto.jsonl` suffixes
      # (https://github.com/ossf/scorecard/blob/main/docs/checks.md#signed-releases).
      - name: Publish the attestations as release assets
        env:
          ASSET_NAME: ${{ env.ASSET }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "${ASSET_NAME}.sigstore.json"
          cp "$SBOM_BUNDLE" "${ASSET_NAME}.sbom.sigstore.json"
          jq -c '.dsseEnvelope' "$PROVENANCE_BUNDLE" > "${ASSET_NAME}.intoto.jsonl"
          payload_type="$(jq -r '.payloadType' "${ASSET_NAME}.intoto.jsonl")"
          if [ "$payload_type" != "application/vnd.in-toto+json" ]; then
            echo "::error::the provenance envelope is not in-toto (payloadType=${payload_type})" >&2
            exit 1
          fi
          predicate="$(jq -r '.payload' "${ASSET_NAME}.intoto.jsonl" | base64 -d | jq -r '.predicateType')"
          if [ "$predicate" != "https://slsa.dev/provenance/v1" ]; then
            echo "::error::the provenance predicate is not SLSA v1 (${predicate})" >&2
            exit 1
          fi
          echo "provenance: ${predicate}"

      # The image job takes the tarball from this run's artifacts, which are
      # bound to the run, rather than from the draft release.
      - name: Hand the tarball to the image job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferroterm-console-${{ inputs.tag }}-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1

      # The release stays a draft; the caller's finalize job publishes it.
      - name: Attach every asset to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ env.ASSET }}
          CHECKSUM_NAME: ${{ env.CHECKSUM }}
          BUILD_SBOM_NAME: ${{ env.BUILD_SBOM }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$ASSET_NAME" \
            "$CHECKSUM_NAME" \
            "$BUILD_SBOM_NAME" \
            "${ASSET_NAME}.sigstore.json" \
            "${ASSET_NAME}.sbom.sigstore.json" \
            "${ASSET_NAME}.intoto.jsonl"

  site:
    name: console site bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # attach the bundle's assets to the draft release
      id-token: write # Sigstore, for the bundle's provenance
      attestations: write # store it against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          target: wasm32-unknown-unknown
      # Prebuilt and checksum-verified by the installer; cargo-leptos finds
      # the wasm-bindgen CLI on PATH, which must equal the wasm-bindgen crate
      # Cargo.lock holds.
      - name: Install cargo-leptos
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-leptos@0.3.11
      - name: Install the wasm-bindgen CLI
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-bindgen@0.2.129
      # Pinned and checked against its SHA-256 before use, so cargo-leptos
      # finds it on PATH and does not download it itself in this attested job.
      - name: Install wasm-opt
        run: |
          bash scripts/release/console-tools.sh "$RUNNER_TEMP/console-tools"
          echo "$RUNNER_TEMP/console-tools/bin" >> "$GITHUB_PATH"
      - name: Build the site bundle
        run: bash scripts/release/console-site.sh --release
      # One tarball, so the bundle is one attested subject.
      - name: Pack the site bundle
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          asset="ferroterm-console-${TAG}-site.tar.gz"
          tar -C target -czf "$asset" site
          sha256sum "$asset" > "${asset}.sha256sum"
          cat "${asset}.sha256sum"
          {
            echo "ASSET=$asset"
            echo "CHECKSUM=${asset}.sha256sum"
          } >> "$GITHUB_ENV"
      - name: Attest the bundle's provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Publish the attestation as release assets
        env:
          ASSET_NAME: ${{ env.ASSET }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "${ASSET_NAME}.sigstore.json"
          jq -c '.dsseEnvelope' "$PROVENANCE_BUNDLE" > "${ASSET_NAME}.intoto.jsonl"
          predicate="$(jq -r '.payload' "${ASSET_NAME}.intoto.jsonl" | base64 -d | jq -r '.predicateType')"
          if [ "$predicate" != "https://slsa.dev/provenance/v1" ]; then
            echo "::error::the provenance predicate is not SLSA v1 (${predicate})" >&2
            exit 1
          fi
      - name: Hand the bundle to the image job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferroterm-console-${{ inputs.tag }}-site
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1
      - name: Attach every asset to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ env.ASSET }}
          CHECKSUM_NAME: ${{ env.CHECKSUM }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$ASSET_NAME" \
            "$CHECKSUM_NAME" \
            "${ASSET_NAME}.sigstore.json" \
            "${ASSET_NAME}.intoto.jsonl"

  image:
    name: console image (linux/amd64, linux/arm64)
    needs: [binary, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # the attestations API, to verify the inputs
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Every tarball of this run: one per target and the site bundle.
      - name: Download the binaries and the site bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ferroterm-console-${{ inputs.tag }}-*
          path: inputs/
          merge-multiple: true

      # Refuse any input this workflow did not attest. The staged layout is
      # the one docker/console/Dockerfile copies from, dist/console/, and both
      # platforms it builds must be present.
      - name: Verify the inputs and stage them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/release-console.yml"
          mkdir -p dist/console
          while read -r arch target; do
            tarball="inputs/ferroterm-console-${TAG}-${target}.tar.gz"
            gh attestation verify "$tarball" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
            mkdir -p "dist/console/linux_${arch}"
            tar -C "dist/console/linux_${arch}" -xzf "$tarball" ferroterm-console
            test -x "dist/console/linux_${arch}/ferroterm-console"
          done < <(jq -r '.include[] | "\(.arch) \(.target)"' <<< "$TARGETS")
          for arch in amd64 arm64; do
            if [ ! -x "dist/console/linux_${arch}/ferroterm-console" ]; then
              echo "::error::no linux/${arch} console binary among the targets" >&2
              exit 1
            fi
          done
          site="inputs/ferroterm-console-${TAG}-site.tar.gz"
          gh attestation verify "$site" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
          tar -C dist/console -xzf "$site" site
          for file in ferroterm-console.wasm ferroterm-console.js; do
            test -s "dist/console/site/pkg/${file}"
          done

      # No QEMU: docker/console/Dockerfile runs no command, it only copies what
      # was built for each platform above
      # (https://docs.docker.com/build/building/multi-platform/).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags: the version, and for a release that is not a pre-release also
      # its major.minor and latest, both skipped for a pre-release by the
      # action's own semver rule, as release-image.yml tags the server.
      - name: Image tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          # These repeat the build-independent set docker/console/Dockerfile
          # carries, so the two never disagree.
          labels: |
            org.opencontainers.image.title=FerroTERM Console
            org.opencontainers.image.description=The FerroTERM Console: browse, check and edit what a FerroTERM server serves, over its FHIR API
            org.opencontainers.image.url=https://ferroterm.eu
            org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroTERM
            org.opencontainers.image.vendor=FerroTERM
            org.opencontainers.image.licenses=BUSL-1.1
          annotations: |
            org.opencontainers.image.title=FerroTERM Console
            org.opencontainers.image.description=The FerroTERM Console: browse, check and edit what a FerroTERM server serves, over its FHIR API
            org.opencontainers.image.url=https://ferroterm.eu
            org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroTERM
            org.opencontainers.image.vendor=FerroTERM
            org.opencontainers.image.licenses=BUSL-1.1

      # Cold by construction. BuildKit's own unsigned attestations are off;
      # the GitHub attestations below carry provenance and the SBOMs.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          # By digest, untagged: scan-and-tag.yml tags the index only after the
          # scan and the vulnerability record pass. Attestations bind the
          # digest, so they are the same either way.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Resolve the platform manifests
        id: manifests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          index="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw)"
          amd64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$index")"
          arm64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<< "$index")"
          case "$amd64" in sha256:*) ;; *) echo "::error::no linux/amd64 manifest in ${DIGEST}" >&2; exit 1 ;; esac
          case "$arm64" in sha256:*) ;; *) echo "::error::no linux/arm64 manifest in ${DIGEST}" >&2; exit 1 ;; esac
          {
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"

      # syft reads the dependency list cargo-auditable embedded in the binary,
      # so the SBOM names the crates rather than the files in the image.
      - name: Install syft
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: syft@1.51.1
      - name: Generate one SBOM per platform
        env:
          VERSION: ${{ inputs.version }}
          AMD64: ${{ steps.manifests.outputs.amd64 }}
          ARM64: ${{ steps.manifests.outputs.arm64 }}
        run: |
          set -euo pipefail
          syft scan "registry:${IMAGE}@${AMD64}" --platform linux/amd64 \
            -o "spdx-json=ferroterm-console-${VERSION}-image-amd64.spdx.json"
          syft scan "registry:${IMAGE}@${ARM64}" --platform linux/arm64 \
            -o "spdx-json=ferroterm-console-${VERSION}-image-arm64.spdx.json"
          # A `pkg:cargo/` purl comes only from the `.dep-v0` section
          # cargo-auditable wrote into the binary.
          for f in "ferroterm-console-${VERSION}-image-amd64.spdx.json" "ferroterm-console-${VERSION}-image-arm64.spdx.json"; do
            if ! jq -e '[.packages[].externalRefs[]? | select(.referenceLocator | startswith("pkg:cargo/"))] | length > 0' "$f" > /dev/null; then
              echo "::error::${f} carries no pkg:cargo purl; was the binary built with cargo auditable?" >&2
              exit 1
            fi
          done

      - name: Attest the index provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest the linux/amd64 provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.amd64 }}
          push-to-registry: true
      - name: Attest the linux/amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.amd64 }}
          sbom-path: ferroterm-console-${{ inputs.version }}-image-amd64.spdx.json
          push-to-registry: true
      - name: Attest the linux/arm64 provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.arm64 }}
          push-to-registry: true
      - name: Attest the linux/arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.arm64 }}
          sbom-path: ferroterm-console-${{ inputs.version }}-image-arm64.spdx.json
          push-to-registry: true

      # The lane checks its own output the way a consumer would, so a broken
      # attestation fails the release rather than the first deployment.
      - name: Verify the published image as a consumer
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.manifests.outputs.amd64 }}
          ARM64: ${{ steps.manifests.outputs.arm64 }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/release-console.yml"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
          for manifest in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://${IMAGE}@${manifest}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
            gh attestation verify "oci://${IMAGE}@${manifest}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
          {
            echo "image ${IMAGE}:${VERSION}"
            echo "index ${DIGEST}"
            echo "amd64 ${AMD64}"
            echo "arm64 ${ARM64}"
          } >> "$GITHUB_STEP_SUMMARY"
