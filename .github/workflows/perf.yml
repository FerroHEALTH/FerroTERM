# The performance gate (#1151), called by ci.yml on a change that reaches
# the server or the sync service and by release.yml on the release commit.
# It builds ferroterm-server, ferroterm-sync and the testkit's
# ferroterm-fixture in release mode, installs ferrohealth-perf
# (FerroHEALTH/FerroSYS#249) at its docs/VERSIONS.md pin, and runs
# scripts/perf/gate.sh: for each service the idle phase and the load phase
# judged against its perf/<service>/baseline.toml, and the sync service
# whose schedule never waits, which the idle phase must fail. The reports and
# the baselines are uploaded whatever the outcome, so a baseline written
# with `update` is taken from the artifact. No specification governs this:
# our own design.
name: Perf

on:
  workflow_call:
    inputs:
      update:
        description: Write the baselines under perf/ from runs that pass.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FERROHEALTH_PERF_VERSION: 0.1.1
      FERROTERM__USAGE_REPORT__ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: perf
      - name: Install ferrohealth-perf
        run: cargo install ferrohealth-perf --version "=${FERROHEALTH_PERF_VERSION}" --locked
      - name: Build the services and the fixture writer
        run: cargo build --release --locked -p ferroterm-server -p ferroterm-sync -p ferroterm-testkit --bin ferroterm --bin ferroterm-sync --bin ferroterm-fixture
      - name: Gate the performance
        env:
          UPDATE: ${{ inputs.update }}
        run: |
          set -euo pipefail
          if [ "$UPDATE" = "true" ]; then
            bash scripts/perf/gate.sh run --update
          else
            bash scripts/perf/gate.sh run
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report
          path: |
            target/perf/
            perf/server/baseline.toml
            perf/sync/baseline.toml
          if-no-files-found: ignore
          retention-days: 30
