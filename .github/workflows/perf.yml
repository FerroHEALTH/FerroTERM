# The performance gate (#1151), called by ci.yml on a change that reaches
# the server or the sync service and by release.yml on the release commit.
# Each attempt job builds ferroterm-server, ferroterm-sync and the testkit's
# ferroterm-fixture in release mode for the commit and for its base, installs
# ferrohealth-perf (FerroHEALTH/FerroSYS#249) at its pin and runs
# scripts/perf/gate.sh once through .github/actions/perf-attempt: the tool's
# A/B mode for each service (#1160), the head's idle phase held to absolute
# limits, then pairs of load phases against the base and the head on the
# same runner, the head judged over the base, and the sync service whose
# schedule never waits, which the idle phase must fail. The base is the
# merge base of the commit with the `base` input, or with none the previous
# release. An attempt that ends with exit 2 could not be judged and says
# nothing about the code, so it is retried on a fresh runner on any CPU
# model. Some runners stall the gate for a whole job
# (FerroHEALTH/FerroPIX#511), so an attempt that ends with exit 1 on a CPU
# model STALL_PRONE lists is retried too. At most two retries run (#1156).
# The verdict job passes the gate when the last attempt that ran passed; a
# breach on any other model fails at once, with no retry. No specification
# governs this: our own design.
name: Perf

on:
  workflow_call:
    inputs:
      base:
        description: >-
          The commit or ref the base is the merge base with: the pull
          request's base, the merge group's, or the commit before a push.
          Empty takes the previous release.
        required: false
        default: ""
        type: string

permissions: {}

env:
  FERROHEALTH_PERF_VERSION: 0.5.2
  FERROTERM__USAGE_REPORT__ENABLED: "false"
  # The CPU models whose runners stall every route for 100 to 300 ms for a
  # whole job (FerroHEALTH/FerroPIX#511), one per line. A breach is retried
  # only on one of them; an exit 2 is retried on any model.
  STALL_PRONE: |
    AMD EPYC 9V74 80-Core Processor

jobs:
  perf:
    name: perf (attempt 1)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: perf
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "1"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}
          stall-prone: ${{ env.STALL_PRONE }}

  perf-retry:
    name: perf (attempt 2)
    needs: perf
    if: needs.perf.outputs.retryable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: perf
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "2"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}
          stall-prone: ${{ env.STALL_PRONE }}

  perf-retry-2:
    name: perf (attempt 3)
    needs: perf-retry
    if: needs.perf-retry.outputs.retryable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      code: ${{ steps.attempt.outputs.code }}
      retryable: ${{ steps.attempt.outputs.retryable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base is built from history, so every commit is fetched.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: perf
      - id: attempt
        uses: ./.github/actions/perf-attempt
        with:
          attempt: "3"
          base: ${{ inputs.base }}
          version: ${{ env.FERROHEALTH_PERF_VERSION }}
          stall-prone: ${{ env.STALL_PRONE }}

  # The gate passes when the last attempt that ran passed; an attempt job
  # that did not finish fails it.
  verdict:
    name: perf verdict
    needs: [perf, perf-retry, perf-retry-2]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The last attempt passed
        env:
          RESULTS: ${{ needs.perf.result }} ${{ needs.perf-retry.result }} ${{ needs.perf-retry-2.result }}
          CODES: ${{ needs.perf.outputs.code }} ${{ needs.perf-retry.outputs.code }} ${{ needs.perf-retry-2.outputs.code }}
        run: |
          set -euo pipefail
          echo "attempt results: ${RESULTS}; exit codes: ${CODES}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "::error title=Performance gate::an attempt did not finish"
              exit 1
              ;;
          esac
          last="$(awk '{ print $NF }' <<< "${CODES}")"
          if [ "$last" != "0" ]; then
            echo "::error title=Performance gate::the last attempt ended with exit ${last}"
            exit 1
          fi
          echo "the last attempt passed"
