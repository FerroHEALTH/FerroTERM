# Scheduled vulnerability scan of the PUBLISHED container images (no
# specification governs the schedule: our own design, the lane FerroEHR runs).
#
# The release gate (scan-and-tag.yml) scans an image the run just built, which
# catches what was known at build time and nothing after. A CVE published the
# week after a release applies to the image people are running, so this lane
# looks again every week, at the tag a user pulls from GHCR.
#
# The adjudications carry over: `trivy.yaml` brings `.trivyignore.yaml`,
# `ignore-unfixed` and the HIGH/CRITICAL floor, and `--vex` applies every
# OpenVEX document under security/vex/. The `pkg:oci/...` products of those
# documents match a published reference, which is what this lane scans.
#
# Run colour: the run is red only when the probe fails (an image that cannot be
# resolved or pulled, a Trivy crash, output jq cannot read). A finding files or
# updates one tracking issue and the run stays green: the issue is the alert,
# where a red scheduled run reaches only someone watching the Actions tab.
name: Published image scan

on:
  schedule:
    # Mondays 06:47 UTC: off the hour, and in a slot no other lane uses
    # (`grep -rE '^ +- cron:' .github/workflows/`).
    - cron: "47 6 * * 1"
  workflow_dispatch:
    inputs:
      report_only:
        description: "Report findings without filing or updating an issue"
        required: false
        default: false
        type: boolean

concurrency:
  group: image-scan
  cancel-in-progress: false

permissions: {}

env:
  # `latest` moves only on a release that is not a pre-release, so it is what
  # an operator following the quickstart pulls. The resolved digest goes into
  # the run summary, so a finding is attributable to exact bytes.
  SCAN_TAG: latest
  # The one Trivy version the release lane runs too.
  TRIVY_VERSION: "0.73.0"

jobs:
  scan:
    name: scan published images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the published images
      issues: write # file or update the one tracking issue below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: this lane decides whether published artifacts are safe, so
      # nothing an earlier run could have poisoned may influence its answer.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan every published image
        id: scan
        env:
          OWNER: ferrohealth
        run: |
          set -euo pipefail
          # Every VEX document under security/vex/, passed as repeated --vex flags.
          vex_args=()
          for doc in security/vex/*.json; do
            [ -e "$doc" ] || continue
            vex_args+=(--vex "$doc")
          done
          echo "VEX documents applied: $(( ${#vex_args[@]} / 2 ))"

          # One platform per Trivy invocation while the published index is
          # dual-arch, so every variant is scanned explicitly.
          total=0
          : > findings.md
          for image in ferroterm ferroterm-console; do
            ref="ghcr.io/${OWNER}/${image}:${SCAN_TAG}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            for platform in linux/amd64 linux/arm64; do
              arch=${platform##*/}
              echo "::group::${image} ${platform} (${digest})"
              trivy image --config trivy.yaml --scanners vuln --platform "$platform" \
                "${vex_args[@]}" -f json -o "${image}.${arch}.json" "$ref"
              count=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' "${image}.${arch}.json")
              jq -r '.Results[]? | .Target as $t | (.Vulnerabilities // [])[]
                | "\($t) | \(.PkgName) \(.InstalledVersion) \(.VulnerabilityID) \(.Severity) -> \(.FixedVersion)"' \
                "${image}.${arch}.json"
              echo "::endgroup::"
              echo "| \`${image}\` | \`${platform}\` | \`${digest}\` | ${count} |" >> findings.md
              total=$((total + count))
            done
          done
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            printf '## Published image scan\n\n'
            printf 'Tag `%s`, Trivy %s, HIGH/CRITICAL with a fix available, VEX applied.\n\n' \
              "$SCAN_TAG" "$TRIVY_VERSION"
            printf '| image | platform | digest | findings |\n|---|---|---|---|\n'
            cat findings.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "total findings: $total"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-scan-reports
          path: "*.json"
          if-no-files-found: warn
          retention-days: 30

      # The findings have a fix, so the remedy is a rebuild and a new release;
      # the issue says so, and says when a VEX statement is the answer instead.
      - name: File or update the tracking issue
        if: steps.scan.outputs.total != '0' && !inputs.report_only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOTAL: ${{ steps.scan.outputs.total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="security(images): the published images carry fixable HIGH/CRITICAL findings"
          {
            printf 'A scheduled scan of the published images found **%s** fixable HIGH/CRITICAL findings.\n\n' "$TOTAL"
            printf '| image | platform | digest | findings |\n|---|---|---|---|\n'
            cat findings.md
            printf '\nThe reports are attached to the run as `image-scan-reports`: %s\n' "$RUN_URL"
            printf '\nThese findings have a fix, so the remedy is a rebuild and a new release'
            printf ' of the affected image. A finding that does not affect FerroTERM belongs'
            printf ' in `security/vex/` with its argument (`security/vex/README.md`).\n'
          } > body.md
          open=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$open" ]]; then
            gh issue comment "$open" --body-file body.md
          else
            bash scripts/gh/fields.sh new bug high medium \
              --title "$title" --body-file body.md --label security
          fi
