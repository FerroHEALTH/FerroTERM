# .github/dependabot.yml — automated dependency updates.
#
# Three ecosystems: the GitHub Actions that the workflows and the composite
# actions in this directory pin, Cargo, and the digest-pinned base image of
# docker/Dockerfile.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows and a root action.yml only; a composite
    # action under .github/actions is scanned only when its directory is
    # listed (the Dependabot options reference, "directory"). The glob keeps
    # every composite action in the same weekly group as the workflows.
    directories:
      - "/"
      - "/.github/actions/*"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    # A delay between a release being published and this bot proposing it, so a
    # compromised or yanked release has a window to be caught before it reaches
    # a pull request (the OWASP CI/CD Security Cheat Sheet's third-party-code
    # control). Seven days is the floor zizmor's `dependabot-cooldown` audit
    # enforces; cargo waits longer, because a crate also ships in the binary.
    #
    # SECURITY updates are exempt by design — Dependabot applies no cooldown to
    # advisory-driven bumps, so an advisory still arrives immediately. That is
    # what makes a cooldown safe rather than a delay on getting fixes.
    # `semver-major-days` is not accepted for this ecosystem (Dependabot
    # rejected the file with it); the 7-day default covers every bump.
    cooldown:
      default-days: 7
    groups:
      # ONE weekly PR for every minor/patch action bump (one codeql-action
      # release alone opens three PRs, one per sub-action). MAJORS stay
      # individual: a breaking action major is a real review, and burying one
      # in a batch is how it gets rubber-stamped.
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"          # plain conventional prefix; no attribution

  - package-ecosystem: "cargo"
    directory: "/"
    labels:
      - "dependencies"
    # Daily, so a release of a FerroHEALTH family crate reaches a pull request
    # the next day. A group takes its entry's schedule, and two cargo entries
    # may not share a directory (the Dependabot options reference), so the
    # whole entry runs daily; the cooldown below still holds every other
    # crate back for its days.
    schedule:
      interval: "daily"
    # Longer than actions: a compromised crate executes in the build AND ships
    # in the binary, which is the higher-consequence case. Security bumps are
    # exempt from the cooldown, as above.
    cooldown:
      default-days: 7
      semver-major-days: 14
      # The family's own crates, published through Trusted Publishing: no wait.
      exclude:
        - "ferrohealth-*"
        - "openehr-*"
        - "ferrobridge-*"
        - "fhir-types"
        - "hl7v2-types"
        - "fhirconnect"
        - "eehrxf"
        - "ihe-*"
        - "nl-generic-functions"
        - "sct-*"
        - "fhir-terminology"
        - "ehds-logging"
    open-pull-requests-limit: 10
    groups:
      # The FHIR model is a product surface, not a routine dependency: it is
      # generated and published by the FerroBRIDGE repository, and a release
      # changes the types this server serves. It gets its own pull request, and
      # the versions guard fails that PR until docs/VERSIONS.md and the root
      # requirement move with the lock. A group is matched in file order, so
      # this one claims fhir-types before the catch-all below.
      fhir-model:
        patterns: ["fhir-types"]
      # ONE PR for every crate the FerroHEALTH family publishes, so the
      # family moves together and no product falls behind its siblings. It
      # claims them before the catch-all below; fhir-types stays in the
      # fhir-model group above, which claims it first.
      ferrohealth-family:
        patterns:
          - "ferrohealth-*"
          - "openehr-*"
          - "ferrobridge-*"
          - "fhir-types"
          - "hl7v2-types"
          - "fhirconnect"
          - "eehrxf"
          - "ihe-*"
          - "nl-generic-functions"
          - "sct-*"
          - "fhir-terminology"
          - "ehds-logging"
      # ONE PR for every other minor/patch bump; lockstep families
      # (serde, axum/tower, ...) bump together inside it by construction.
      # MAJORS stay individual: a semver major in shipped code is a real
      # review.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    # The server's and the console's recipes share the base image and digest.
    directories: ["/docker", "/docker/console"]
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    # The base image is pinned by index digest; a bump is a reviewed change of
    # digest, like an action. Security bumps are exempt from the cooldown.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build"
