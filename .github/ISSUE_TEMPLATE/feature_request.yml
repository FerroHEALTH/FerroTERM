# SPDX-License-Identifier: BUSL-1.1
name: Feature request
description: Propose a new capability or an improvement.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        The type is already Feature, and a maintainer sets the priority during
        triage, so you do not need to choose one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem you want to solve, and who it affects.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you want FerroTERM to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.
    validations:
      required: false
  - type: textarea
    id: spec
    attributes:
      label: Spec reference
      description: The FHIR, SNOMED CT, or ECL section this relates to, if any. Cite the exact page or clause.
    validations:
      required: false
