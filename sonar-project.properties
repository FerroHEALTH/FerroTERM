# SPDX-License-Identifier: BUSL-1.1
# SonarQube Cloud project configuration.
#
# Advisory analysis only: it never outranks the specifications, the project
# rules, or the local gates, and it gates no merge
# (.claude/rules/ai-code-review.md). The quality gate is the built-in
# "Sonar way" default.
#
# The analyzer sees the Rust workspace, with the coverage the workflow
# imports, and the multi-language sweep over shell, YAML, JSON, and
# markdown-adjacent config.

sonar.projectKey=FerroHEALTH_FerroTERM
sonar.organization=ferrohealth
sonar.projectName=FerroTERM
sonar.sourceEncoding=UTF-8

# Scope: analyze the tree, minus build output and vendored inputs. The two
# mermaid scripts of the book are third-party, written by
# `mdbook-mermaid install website/book` and never edited here.
sonar.sources=.
sonar.exclusions=**/target/**,crates/*/vendor/**,addons/*/vendor/**,website/book/mermaid.min.js,website/book/mermaid-init.js

# Rust coverage is imported from the instrumented nextest run (lcov), wired into
# the sonar workflow when the Cargo workspace exists.
sonar.rust.lcov.reportPaths=lcov.info
# The console's view layer is left out of coverage (#825), as FerroEHR did for
# its viewer on its #2862: the pages, the app root and the shell chrome are
# Leptos views whose islands hydrate in the browser as wasm, their acceptance
# instrument is the browser journey battery (scripts/ui-e2e.sh), and the host
# lcov run sees none of the browser half. Tests that only execute Leptos view macros are the line-execution-only
# class testing.md forbids. The server half of the crate keeps its unit-test
# coverage, and every file stays analyzed for issues and duplication. The
# crate is `app/ferroterm-console` since its rename (#809).
sonar.coverage.exclusions=\
  app/ferroterm-console/src/app.rs,\
  app/ferroterm-console/src/shell.rs,\
  app/ferroterm-console/src/pages/**

# sonar.projectVersion is appended by the workflow at scan time from the
# workspace version (never a second hand-maintained copy) once Cargo.toml exists.
