# SPDX-License-Identifier: BUSL-1.1
# SonarQube Cloud project configuration.
#
# Advisory analysis only: it never outranks the specifications, the project
# rules, or the local gates, and it gates no merge
# (.claude/rules/ai-code-review.md). The quality gate is the built-in
# "Sonar way" default.
#
# The analyzer sees the Rust workspace, with the coverage the workflow
# imports, and the multi-language sweep over shell, YAML, JSON, and
# markdown-adjacent config.

sonar.projectKey=FerroHEALTH_FerroTERM
sonar.organization=ferrohealth
sonar.projectName=FerroTERM
sonar.sourceEncoding=UTF-8

# Scope: analyze the tree, minus build output and vendored inputs. The two
# mermaid scripts of the book are third-party, written by
# `mdbook-mermaid install website/book` and never edited here.
sonar.sources=.
sonar.exclusions=**/target/**,crates/*/vendor/**,addons/*/vendor/**,website/book/mermaid.min.js,website/book/mermaid-init.js

# Rust coverage is imported from two lcov reports: the instrumented nextest run
# over the workspace, and the browser journeys against an instrumented console
# (scripts/ui-e2e-coverage.sh), which is what proves the console's pages, app
# root and shell. Sonar merges the two per line. The site bundle the browser
# hydrates is wasm and stays unmeasured; the server half draws every page.
sonar.rust.lcov.reportPaths=lcov.info,console-journeys.lcov

# sonar.projectVersion is appended by the workflow at scan time from the
# workspace version (never a second hand-maintained copy) once Cargo.toml exists.

# docker:S8431 asks a FROM line for either the tag or the digest. Every
# Dockerfile here names both on purpose: the tag says which distroless variant
# a reader is looking at, and the digest fixes the bytes, which Dependabot's
# docker ecosystem keeps current. The rule is off for the Dockerfiles alone.
sonar.issue.ignore.multicriteria=dockerTagAndDigest
sonar.issue.ignore.multicriteria.dockerTagAndDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockerTagAndDigest.resourceKey=docker/**/Dockerfile*
