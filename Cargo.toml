[workspace]
resolver = "3"
members = ["crates/*", "addons/*", "app/*", "tools/*"]
# The fuzz targets build under nightly with sanitizers; the workspace stays on
# the pinned stable toolchain (fuzz/README.md). The browser journeys are
# excluded for a different reason, recorded in e2e/Cargo.toml: their WebDriver
# client changes how serde_json writes every object, and cargo unifies features
# across one invocation.
exclude = ["fuzz", "e2e"]

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
repository = "https://github.com/FerroHEALTH/FerroTERM"
homepage = "https://ferroterm.eu"
authors = ["Ruben Talstra"]
# The server and the tools are never published; the `crates/*` members set
# `publish = true` and carry their own lockstep version line
# (.claude/rules/crates-publishing.md).
publish = false

# The authoritative third-party set. A crate takes a dependency with
# `dep.workspace = true`; every version below was checked against crates.io on
# 2026-09-02 and Cargo.lock pins the exact resolution.
[workspace.dependencies]
# Ontology store and indexes.
redb = "4.2.0"
roaring = "0.11.5"
fst = "0.4.7"
petgraph = "0.8.3"
# Unicode normalization for the designation tokenizer (NFD, combining-mark stripping).
unicode-normalization = "0.1.25"
# HTTP and async.
axum = "0.8.9"
prometheus-client = "0.25.1"
tower = "0.5.3"
hyper = "1.11.1"
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http = "1.5.0"
# TLS for the outbound calls the server makes: the OIDC issuer's discovery
# document and its JWKS, and the usage report, over the `hyper-util` client the
# health probe already uses. Checked against crates.io on 2026-09-22.
hyper-rustls = "0.27.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# Regular-expression filters (`regex` in ValueSet.compose.include.filter.op).
regex = "1.13.1"
# ECL parsing and diagnostics.
logos = "0.16.1"
winnow = "1.0.4"
miette = "7.6.0"
ariadne = "0.6.0"
# RF2 (tab-delimited, streamed); releases arrive zipped.
csv = "1.4.0"
# Data parallelism for the offline build (order-preserving collection).
rayon = "1.12.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The UCUM essence (unit definitions) is XML.
quick-xml = "0.42.0"
# Content digests. A syndication feed advertises a SHA-256 for a content item,
# and the MLDS feed advertises an MD5; both versions were checked against
# crates.io on 2026-09-22.
sha2 = "0.11.0"
md-5 = "0.11.0"
# Serde and formats.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# The synchronisation service and the console each read one TOML configuration
# file; the console writes its environment overrides back into the tree, so the
# writer half is on. Checked against crates.io on
# 2026-09-22.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "display", "serde"] }
# The FerroHEALTH SMART and OAuth 2.0 resource-server crate: the token check,
# the SMART scopes, the Basic users and the client credentials token of the
# server and the sync service. Pinned exactly, as every family crate is.
# Verified against crates.io on 2026-10-21.
ferrohealth-smart = { version = "=0.4.1", features = ["axum"] }
# The Argon2id hashes of the Basic users the SMART tests configure, the
# version and features ferrohealth-smart verifies them with. Verified against
# crates.io on 2026-10-20.
argon2 = { version = "0.6.0", default-features = false, features = ["password-hash", "alloc"] }
# The console checks the ID token it signs in with, and the SMART tests mint
# the access tokens they present. The `aws_lc_rs` backend is
# the one `rustls` already resolves to; the pure-Rust backend would add the
# `rsa` crate, which carries an unresolved RustSec advisory. Checked against
# crates.io on 2026-09-22.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
# Errors.
thiserror = "2.0.20"
anyhow = "1.0.104"
# Dates and times.
jiff = "0.2.35"
# Expansion identifiers (`ValueSet.expansion.identifier`, a `urn:uuid:`).
uuid = { version = "1.26.0", features = ["v4"] }
# The console (app/ferroterm-viewer): a Leptos app rendered on the server and
# hydrated in the browser, with a backend-for-frontend that reaches the FHIR
# API server to server. The halves are chosen by target, so the workspace pins
# leptos with no render-mode feature and the console turns `ssr` on for the
# host and `hydrate` for wasm32. The wasm-bindgen CLI cargo-leptos runs must
# equal the crate (docs/VERSIONS.md). Verified against crates.io on 2026-10-18.
leptos = "0.8.22"
leptos_axum = "0.8.10"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1.7"
# The shared FerroHEALTH UI components, pinned exactly: a console moves its pin
# after looking at its own screens. Verified against crates.io on 2026-10-21.
ferrohealth-ui = "=0.2.2"
# The console's string catalogs: Project Fluent messages embedded at build
# time from app/ferroterm-viewer/locales/, the crate and version
# ferrohealth-ui catalogs its own words with, so one locale drives both.
# Verified against crates.io on 2026-10-19.
fluent-templates = { version = "0.15.1", default-features = false, features = ["macros", "walkdir"] }
percent-encoding = "2.3.2"
# The console's operator sign-in: the `__Host-` session cookies, the random
# ids, PKCE verifiers and the SHA-256 of a PKCE challenge (RFC 7636 §4.2) from
# the crypto library rustls already builds on, a configured secret held so it
# never renders, and the URLs of the FHIR server and the OpenID Provider.
# Verified against crates.io on 2026-10-18.
cookie = { version = "0.18.2", default-features = false }
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
secrecy = { version = "0.10.3", features = ["serde"] }
url = "2.5.8"
# Only the console's site bundle is compressed, brotli or gzip as the request
# asks; the security headers are set per response. Verified 2026-10-18.
tower-http = { version = "0.7.1", default-features = false, features = ["set-header", "compression-br", "compression-gzip"] }
# Observability.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Command-line parsing for the tools and the server binary.
clap = { version = "4.6.6", features = ["derive", "env"] }
# Testing.
insta = { version = "1.48.0", features = ["json"] }
proptest = "1.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
wiremock = "0.6.5"
# The usage report tests validate every report against FerroPULSE's vendored
# JSON Schema; no network or file resolution, so no default features. Checked
# against crates.io on 2026-10-16.
jsonschema = { version = "0.58.6", default-features = false }
# The test issuer generates its own signing key and publishes it as a JWK, so
# no private key is committed. Checked against crates.io on 2026-09-22.
ring = "0.17.14"
base64 = "0.23.1"
criterion = "0.8.2"
divan = "0.1.21"
tempfile = "3.27.0"
# The FHIR model: generated and published by the FerroBRIDGE repository, and
# consumed here from crates.io like any other third-party crate. The pin is
# recorded in docs/VERSIONS.md and `scripts/checks/versions.sh` fails when the
# manifest, the lock, and that table disagree.
fhir-types = "0.1.109"
# Workspace-internal crates. The `crates/*` members carry the published crate
# line (lockstep, bumped with their packaged content, never the product
# version); the tools stay on the workspace version.
rf2 = { path = "crates/rf2", version = "0.1.120" }
loinc = { path = "crates/loinc", version = "0.1.120" }
classification = { path = "crates/classification", version = "0.1.120" }
dhd-thesaurus = { path = "crates/dhd-thesaurus", version = "0.1.120" }
gstandaard = { path = "crates/gstandaard", version = "0.1.120" }
labcodeset = { path = "crates/labcodeset", version = "0.1.120" }
icd11 = { path = "crates/icd11", version = "0.1.120" }
rxnorm-rrf = { path = "crates/rxnorm-rrf", version = "0.1.120" }
concept-graph = { path = "crates/concept-graph", version = "0.1.120" }
concept-store = { path = "crates/concept-store", version = "0.1.120" }
designation-index = { path = "crates/designation-index", version = "0.1.120" }
sct-ecl = { path = "crates/sct-ecl", version = "0.1.120" }
sct-scg = { path = "crates/sct-scg", version = "0.1.120" }
fhir-terminology = { path = "crates/fhir-terminology", version = "0.1.120" }
terminology-syndication = { path = "crates/terminology-syndication", version = "0.1.120" }
# The source add-ons. Path-only and never published; only app/ferroterm-sync
# may take one (scripts/checks/addon-boundary.sh).
addon-nts = { path = "addons/nts" }
# Path-only, with no `version`: cargo then strips the dev-dependency from a
# packaged crates/* manifest instead of looking it up on crates.io.
ferroterm-testkit = { path = "tools/ferroterm-testkit" }
ferroterm-build = { path = "tools/ferroterm-build" }

# The reliability bar (.claude/rules/reliability.md). Groups sit at priority -1
# so every named lint below overrides its group.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
non_local_definitions = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
deprecated_safe_2024 = "deny"
ambiguous_negative_literals = "deny"
unused_must_use = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Panics are for states that cannot happen; everything else is a Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Numeric honesty: no silent narrowing, wrapping, or lossy literals.
as_conversions = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
integer_division = "warn"
unchecked_time_subtraction = "deny"
# Guards, results, and causes are never dropped on the floor.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "warn"
# Determinism: hash iteration order feeds nothing that must be stable.
iter_over_hash_type = "deny"
# Libraries speak tracing; only binaries write to stdio, and nothing exits.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
# Suppressions are scoped, justified, and self-reporting.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
# Documentation and comment shape (RFC 505 / RFC 1574).
too_long_first_doc_paragraph = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# The RFC 3107 shape: derive Default when the default is a variant.
derivable_impls = "deny"
# API hygiene: no re-exports, no pointer leakage, the right std call.
pub_use = "deny"
incompatible_msrv = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
pointer_format = "deny"
empty_drop = "warn"
deref_by_slicing = "warn"
try_err = "warn"
clone_on_ref_ptr = "warn"
cfg_not_test = "warn"
infinite_loop = "warn"
mixed_read_write_in_expression = "warn"
same_name_method = "warn"
debug_assert_with_mut_call = "warn"
wildcard_dependencies = "deny"
negative_feature_names = "deny"
redundant_feature_names = "deny"
# Explicitly named (default-on) lints that carry rules from the reliability bar.
disallowed_methods = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"
let_underscore_lock = "deny"

# Fail loud: overflow panics rather than wrapping, the panic unwinds so the
# HTTP layer can turn it into a clean 500, and a production panic names its
# file and line.
[profile.release]
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"

# The console's WebAssembly is downloaded by every reader, so it optimizes for
# size where the server optimizes for speed. cargo-leptos selects this profile
# with `lib-profile-release` in app/ferroterm-viewer/Cargo.toml.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
# A WebAssembly stack trace is a browser-console concern, and the debug info
# is dead weight in a downloaded artifact.
debug = false
strip = "debuginfo"

