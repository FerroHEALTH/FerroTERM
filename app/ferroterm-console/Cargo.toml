[package]
name = "ferroterm-console"
description = "The FerroTERM Console: a Leptos app drawn on the server in islands mode, with a backend-for-frontend over the terminology server's FHIR API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Never published: the console ships as its own binary and image.
publish = false

# One crate, two halves (the Leptos book, "Guide: Islands"): the rlib feeds
# the server binary and the cdylib is the WebAssembly the browser hydrates the
# islands with. cargo-leptos builds the cdylib for wasm32 and the binary for
# the host.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ferroterm-console"
path = "src/main.rs"

# The evidence pane states figures the repository already commits, so the
# build script reads those files and emits the document the page carries.
[build-dependencies]
serde_json.workspace = true

# Both halves on every target. The server half and the browser half are
# chosen by target rather than by Cargo feature, so `--all-features` over the
# workspace can never turn both on at once; a target dependency's features
# apply only to a build for that target (the Cargo reference, resolver
# version 2 and later). No specification governs this: our own design.
#
# The console is a FHIR client and depends on NO workspace crate, so that
# anything it can do a client can do. scripts/checks/console-boundary.sh fails
# when an edge into the engine appears. The pages are drawn on the host alone,
# so the browser half takes the components and leptos, whose islands it
# hydrates, and nothing else.
[dependencies]
ferrohealth-ui.workspace = true
leptos = { workspace = true, features = ["islands"] }
# An island's props cross to the browser as JSON, derived through serde.
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { workspace = true, features = ["hydrate"] }
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
# The shortcuts island reads the key that was pressed and follows or submits
# what it names.
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "HtmlFormElement", "KeyboardEvent", "Location", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The configuration loader and the `<key>_file` rule of its secrets.
ferrohealth-config.workspace = true
ferrohealth-health.workspace = true
ferrohealth-secret.workspace = true
ferrohealth-server.workspace = true
# The per-request script nonce of the Content-Security-Policy rides `nonce`.
leptos = { workspace = true, features = ["ssr", "nonce"] }
leptos_axum.workspace = true
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
# The console's own string catalogs under locales/.
fluent-templates.workspace = true
http.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
cookie.workspace = true
# Timestamps read from the server, and the time a page says it answered at.
jiff.workspace = true
# The ID Token of a sign-in, verified against the provider's JWK Set
# (OpenID Connect Core 1.0 §3.1.3.7).
jsonwebtoken.workspace = true
# The terminology server's FHIR API, the OpenID Provider, and the
# healthcheck job asking the console beside it.
reqwest.workspace = true
secrecy.workspace = true
# `sync` holds one refresh of a session's access token at a time.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
# The router driven in-process with `ServiceExt::oneshot`.
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true

# cargo-leptos: the site bundle (the WebAssembly and its JavaScript glue)
# under target/site, the server binary beside it. The console has no
# stylesheet of its own: it serves the components' stylesheet and the
# FerroTERM theme from the library's constants.
[package.metadata.leptos]
output-name = "ferroterm-console"
site-root = "target/site"
site-pkg-dir = "pkg"
# Copied into the site root as it stands: the brand favicon.
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
lib-profile-release = "wasm-release"
