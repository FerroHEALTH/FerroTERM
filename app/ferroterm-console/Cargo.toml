[package]
name = "ferroterm-console"
description = "The FerroTERM Console: a terminology browser and editor whose every page its server draws, with a backend-for-frontend over the terminology server's FHIR API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Never published: the console ships as its own binary and image.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferroterm-console"
path = "src/main.rs"

# The evidence pane states figures the repository already commits, so the
# build script reads those files and emits the document the page carries.
[build-dependencies]
serde_json.workspace = true

# The console is a FHIR client and depends on NO workspace crate, so that
# anything it can do a client can do. scripts/checks/console-boundary.sh fails
# when an edge into the engine appears. It is one axum service: every page is
# a handler that reads the terminology server and returns the whole document,
# drawn with FerroUI's components, whose stylesheet, theme and script modules
# its router serves. No specification governs this: our own design.
[dependencies]
ferrohealth-ui.workspace = true
# The configuration loader and the `<key>_file` rule of its secrets.
ferrohealth-config.workspace = true
# The operator's sign-in at the OpenID Provider and the session: the
# `[oidc]` and `[session]` sections, the store, and the four sign-in routes
# with the middleware every page sits behind.
ferrohealth-session.workspace = true
ferrohealth-health.workspace = true
ferrohealth-secret.workspace = true
ferrohealth-server = { workspace = true, features = ["console"] }
# The console log and the panic line; `otlp` exports the console's spans
# when `[telemetry.otlp]` names a collector.
ferrohealth-telemetry = { workspace = true, features = ["otlp"] }
serde.workspace = true
serde_json.workspace = true
# The FHIR model of every release the server mounts, generated by
# FerroBRIDGE and taken from crates.io, which every answer decodes through.
fhir-types.workspace = true
# The console's own string catalogs under locales/, embedded in the binary.
fluent-templates.workspace = true
# The status of an answer, the addresses a page builds, and the time a page
# says it answered at.
http.workspace = true
jiff.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
url.workspace = true
# A run's record offered as a download.
base64.workspace = true
tracing.workspace = true
axum.workspace = true
clap.workspace = true
cookie.workspace = true
# The terminology server's FHIR API and the healthcheck job asking the
# console beside it.
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml.workspace = true

[dev-dependencies]
# The test provider's signing key.
aws-lc-rs.workspace = true
# The relying party the console signs in through, whose exchange and refresh
# the tests drive, and the ID Tokens the test provider signs.
ferrohealth-smart.workspace = true
jsonwebtoken.workspace = true
tempfile.workspace = true
# The router driven in-process with `ServiceExt::oneshot`.
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true
