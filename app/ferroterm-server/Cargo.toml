# SPDX-License-Identifier: BUSL-1.1
[package]
name = "ferroterm-server"
description = "The FerroTERM FHIR terminology server for SNOMED CT, LOINC, and other clinical code systems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# A thin main.rs over a testable lib.rs (.claude/rules/testing.md).
[lib]
path = "src/lib.rs"

[[bin]]
name = "ferroterm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
ferrohealth-smart.workspace = true
prometheus-client.workspace = true
fhir-types.workspace = true
fhir-terminology.workspace = true
concept-graph.workspace = true
http.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
jiff.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The `[auth]` table is read from the TOML file `FERROTERM_AUTH_FILE` names.
toml.workspace = true
# `time` bounds the health probe; the runtime features come from the workspace.
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# The usage report serializes its instance id.
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
argon2.workspace = true
base64.workspace = true
criterion.workspace = true
ferroterm-testkit.workspace = true
jsonwebtoken.workspace = true
# The SMART tests stand up an issuer and mint tokens for it, so they generate a
# signing key and publish it as a JWK instead of committing one.
ring.workspace = true
secrecy.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
jsonschema.workspace = true
wiremock.workspace = true

[[bench]]
name = "http"
harness = false

[lints]
workspace = true
